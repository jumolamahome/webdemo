<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pages 檔案總管</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --line: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --shadow: 0 10px 30px rgba(0,0,0,.06);
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: #111827;
  color: white;
  padding: 18px 22px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  color: #cbd5e1;
  font-size: 14px;
}

.app {
  width: min(1200px, 94%);
  margin: 24px auto;
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 20px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 560px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: #fafafa;
  flex-wrap: wrap;
}

.toolbar button {
  border: 1px solid var(--line);
  background: white;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.toolbar button:hover {
  background: var(--accent-soft);
}

.breadcrumb {
  flex: 1;
  min-width: 200px;
  font-size: 14px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.file-list {
  padding: 8px;
}

.file-row {
  display: grid;
  grid-template-columns: 42px 1fr 110px;
  align-items: center;
  gap: 8px;
  padding: 11px 12px;
  border-radius: 10px;
  cursor: pointer;
}

.file-row:hover {
  background: var(--accent-soft);
}

.icon {
  font-size: 23px;
  text-align: center;
}

.name {
  font-weight: 600;
  overflow-wrap: anywhere;
}

.meta {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

.viewer-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: #fafafa;
}

.viewer-head h2 {
  margin: 0;
  font-size: 17px;
}

.viewer-head .path {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.viewer {
  padding: 16px;
  height: 490px;
  overflow: auto;
}

pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: Consolas, Menlo, monospace;
  font-size: 13px;
  line-height: 1.55;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}

.status {
  width: min(1200px, 94%);
  margin: 0 auto 26px;
  font-size: 13px;
  color: var(--muted);
}

@media (max-width: 850px) {
  .app {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>📂 GitHub Pages 檔案總管</h1>
  <p>直接讀取 GitHub Repository，可瀏覽資料夾、預覽檔案，HTML 直接開啟。</p>
</header>

<main class="app">

  <section class="panel">
    <div class="toolbar">
      <button id="backBtn">← 上一層</button>
      <button id="homeBtn">⌂ 根目錄</button>
      <button id="refreshBtn">⟳ 重新整理</button>
      <div id="breadcrumb" class="breadcrumb">/</div>
    </div>

    <div id="fileList" class="file-list">
      <div class="empty">讀取 GitHub Repository 中...</div>
    </div>
  </section>

  <section class="panel">
    <div class="viewer-head">
      <h2 id="viewerTitle">檔案內容預覽</h2>
      <div id="viewerPath" class="path">點左邊的檔案查看內容</div>
    </div>

    <div id="viewer" class="viewer">
      <div class="empty">尚未選擇檔案</div>
    </div>
  </section>

</main>

<div id="status" class="status"></div>

<script>
/* =========================================================
   Repository 設定
   =========================================================
   如果未來換 Repository，只要修改這三行。
*/
const GITHUB_OWNER = "jumolamahome";
const GITHUB_REPO = "webdemo";
const GITHUB_BRANCH = "main";

/*
  GitHub Pages 網址的 Repository 基底。

  專案型 Pages：
  https://使用者.github.io/Repository名稱/

  這裡使用相對網址，避免寫死網域。
*/
const PAGE_BASE = new URL("./", window.location.href);

let currentPath = "";

const fileList = document.getElementById("fileList");
const breadcrumb = document.getElementById("breadcrumb");
const viewer = document.getElementById("viewer");
const viewerTitle = document.getElementById("viewerTitle");
const viewerPath = document.getElementById("viewerPath");
const status = document.getElementById("status");


/* =========================================================
   工具函式
   ========================================================= */

function extOf(name) {
  const p = name.lastIndexOf(".");
  return p >= 0 ? name.slice(p + 1).toLowerCase() : "";
}

function parentPath(path) {
  if (!path) return "";

  const parts = path.split("/").filter(Boolean);
  parts.pop();

  return parts.join("/");
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatSize(bytes) {
  if (!bytes) return "";

  if (bytes < 1024)
    return bytes + " B";

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

function iconFor(item) {
  if (item.type === "dir")
    return "📁";

  const ext = extOf(item.name);

  if (["html", "htm"].includes(ext))
    return "🌐";

  if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext))
    return "🖼️";

  if (ext === "pdf")
    return "📕";

  if (["zip", "rar", "7z", "gz"].includes(ext))
    return "🗜️";

  if (["js", "css", "json", "php", "py", "java", "c", "cpp"].includes(ext))
    return "💻";

  return "📄";
}


/* =========================================================
   從 GitHub API 讀取某個目錄
   ========================================================= */
async function loadDirectory(path = "") {

  currentPath = path;

  breadcrumb.textContent = "/" + (path ? path + "/" : "");

  fileList.innerHTML =
    '<div class="empty">讀取目錄中...</div>';

  /*
    GitHub Contents API

    根目錄：
    /repos/OWNER/REPO/contents

    子目錄：
    /repos/OWNER/REPO/contents/資料夾名稱
  */
  let api =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;

  if (path)
    api += "/" + path.split("/").map(encodeURIComponent).join("/");

  api += "?ref=" + encodeURIComponent(GITHUB_BRANCH);

  try {

    const response = await fetch(api, {
      headers: {
        "Accept": "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error(
        `GitHub API 回傳 ${response.status}`
      );
    }

    const items = await response.json();

    if (!Array.isArray(items)) {
      throw new Error("這個位置不是資料夾");
    }

    /*
      排序：
      1. 資料夾排前面
      2. 檔案排後面
      3. 同類型依名稱排序
    */
    items.sort((a, b) => {

      if (a.type !== b.type)
        return a.type === "dir" ? -1 : 1;

      return a.name.localeCompare(
        b.name,
        "zh-Hant",
        { numeric: true }
      );
    });

    renderDirectory(items);

    status.textContent =
      `目前目錄共 ${items.length} 個項目｜資料來源：GitHub Repository ${GITHUB_OWNER}/${GITHUB_REPO}`;

  }
  catch (error) {

    fileList.innerHTML =
      `<div class="empty">
        無法讀取 Repository。<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    status.textContent =
      "請確認 Repository 是公開的，以及 GITHUB_OWNER、GITHUB_REPO、GITHUB_BRANCH 設定是否正確。";
  }
}


/* =========================================================
   顯示檔案與資料夾
   ========================================================= */
function renderDirectory(items) {

  fileList.innerHTML = "";

  if (items.length === 0) {
    fileList.innerHTML =
      '<div class="empty">這個資料夾目前是空的</div>';
    return;
  }

  for (const item of items) {

    const row = document.createElement("div");

    row.className = "file-row";

    row.innerHTML = `
      <div class="icon">${iconFor(item)}</div>

      <div class="name">
        ${escapeHtml(item.name)}
      </div>

      <div class="meta">
        ${
          item.type === "dir"
            ? "資料夾"
            : formatSize(item.size)
        }
      </div>
    `;

    row.addEventListener("click", function () {

      if (item.type === "dir") {
        loadDirectory(item.path);
      }
      else {
        openFile(item);
      }

    });

    fileList.appendChild(row);
  }
}


/* =========================================================
   點檔案後的動作
   ========================================================= */
async function openFile(item) {

  const ext = extOf(item.name);

  /*
    HTML：

    不在右邊顯示原始碼，
    而是像直接輸入 URL 一樣開啟真正的 GitHub Pages 網頁。
  */
  if (ext === "html" || ext === "htm") {

    const pageUrl =
      new URL(
        item.path
          .split("/")
          .map(encodeURIComponent)
          .join("/"),
        PAGE_BASE
      );

    window.location.href = pageUrl.href;
    return;
  }


  viewerTitle.textContent = item.name;
  viewerPath.textContent = item.path;


  /*
    圖片直接預覽
  */
  if (
    ["png", "jpg", "jpeg", "gif", "webp", "svg"]
      .includes(ext)
  ) {

    viewer.innerHTML =
      `<img
        src="${item.download_url}"
        alt="${escapeHtml(item.name)}"
        style="max-width:100%;height:auto;"
      >`;

    return;
  }


  /*
    PDF 直接在 iframe 顯示
  */
  if (ext === "pdf") {

    viewer.innerHTML =
      `<iframe src="${item.download_url}"></iframe>`;

    return;
  }


  /*
    常見文字 / 程式檔：
    直接下載 raw 內容後顯示。
  */
  const textTypes = new Set([
    "txt", "md",
    "css", "js", "json",
    "xml", "csv",
    "yml", "yaml",
    "php",
    "py",
    "java",
    "c", "cpp", "h",
    "sql",
    "log"
  ]);

  if (textTypes.has(ext) || ext === "") {

    viewer.innerHTML =
      '<div class="empty">讀取檔案中...</div>';

    try {

      const response =
        await fetch(item.download_url);

      if (!response.ok)
        throw new Error("讀取失敗");

      const text =
        await response.text();

      viewer.innerHTML = "";

      const pre =
        document.createElement("pre");

      /*
        使用 textContent，
        所以 HTML / JS 內容不會被瀏覽器執行。
      */
      pre.textContent = text;

      viewer.appendChild(pre);

    }
    catch (error) {

      viewer.innerHTML =
        `<div class="empty">
          無法預覽這個檔案
        </div>`;
    }

    return;
  }


  /*
    其他未知格式：
    直接打開 GitHub raw 檔案。
  */
  window.open(
    item.download_url,
    "_blank"
  );
}


/* =========================================================
   導覽按鈕
   ========================================================= */

document
  .getElementById("backBtn")
  .addEventListener("click", function () {

    loadDirectory(
      parentPath(currentPath)
    );

  });


document
  .getElementById("homeBtn")
  .addEventListener("click", function () {

    loadDirectory("");

  });


document
  .getElementById("refreshBtn")
  .addEventListener("click", function () {

    loadDirectory(currentPath);

  });


/* 第一次開啟首頁，讀取 Repository 根目錄 */
loadDirectory("");

</script>

</body>
</html>
