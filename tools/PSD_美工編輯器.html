<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #69bafb;outline-offset:2px}#app{display:flex;flex-direction:column;height:100vh;min-width:720px}.topbar{height:60px;flex:none;display:flex;align-items:center;padding:0 17px;gap:12px;border-bottom:1px solid var(--line);background:#151922}.brand{display:flex;align-items:center;gap:10px;min-width:215px}.brand-logo{height:35px;width:35px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#45b8e9,#7188e7 55%,#a57bef);font-size:19px;font-weight:900;color:#0b1020;box-shadow:0 5px 16px #4877bb55}.brand-name{font-size:15px;font-weight:800;letter-spacing:.1px}.brand-sub{color:var(--sub);font-size:10px;margin-top:2px}.sep{height:23px;width:1px;background:var(--line);flex:none}.grow{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);height:32px;padding:0 12px;border-radius:8px;white-space:nowrap;transition:background .16s,border .16s}.btn:hover{background:#30394a;border-color:#59647b}.btn.primary{background:#548ff0;border-color:#548ff0;color:#071326;font-weight:800}.btn.primary:hover{background:#75adff}.btn.mini{height:27px;padding:0 9px;font-size:12px}.btn.icon{min-width:31px;padding:0 8px;font-size:16px}.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--panel3)}.tag{font-size:10px;font-weight:700;letter-spacing:.5px;color:#7dc9b7;background:#7dc9b71a;border:1px solid #7dc9b74d;padding:4px 7px;border-radius:5px}.workspace{display:flex;flex:1;min-height:0}.tools{width:63p ff;border:2px solid #4eaff3;box-shadow:0 1px 3px #0007;border-radius:2px;pointer-events:auto}.handle[data-h="nw"]{left:-6px;top:-6px;cursor:nwse-resize}.handle[data-h="ne"]{right:-6px;top:-6px;cursor:nesw-resize}.handle[data-h="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}.handle[data-h="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}.selection-label{position:absolute;bottom:calc(100% + 6px);left:0;white-space:nowrap;padding:3px 6px;border-radius:4px;background:#3774a5;color:white;font-size:10px;max-width:180px;overflow:hidden;text-overflow:ellipsis}.stage-tip{position:sticky;left:15px;top:15px;background:#191f2be8;border:1px solid var(--line);color:#9facbf;padding:8px 12px;border-radius:8px;max-width:max-content;pointer-events:none;z-index:2;font-size:11px;display:none}.statusbar{height:35px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#191e28;padding:0 13px;color:var(--sub);font-size:11px}.status-left,.status-right{display:flex;align-items:center;gap:12px}.dot{height:7px;width:7px;background:#70d4b8;border-radius:50%;display:inline-block;margin-right:5px}.rightpanel{width:294px;flex:none;border-left:1px solid var(--line);background:#181d27;display:flex;flex-direction:column;min-height:0;overflow:hidden}.panel-section{border-bottom:1px solid var(--line)}.panel-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.panel-head strong{font-size:12px;letter-spacing:.5px}.panel-head .faded{font-size:11px;color:var(--sub)}.layer-controls{padding:0 12px 10px;display:flex;gap:5px}.layer-controls .btn{flex:1;min-width:0}.layers{padding:1px 9px 12px;overflow-y:auto;min-height:110px;flex:1}.layer-item{display:flex;align-items:center;gap:8px;padding:7px 7px;margin:3px 0;border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:57px}.layer-item:hover{background:#242c3c}.layer-item.selected{background:#2d4161;border-color:#5877a3}.eye,.lock{background:none;border:0;padding:3px;color:#b5c0d5;font-size:15px;min-width:22px}.eye.off{color:#526077}.thumb{width:41px;height:37px;border:1px solid #4a556b;border-radius:5px;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;background-image:linear-gradient(45deg,#d6d6d6 25%,transparent 25%),linear-gradient(-45deg,#d6d6d6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6d6d6 75%),linear-gradient(-45deg,transparent 75%,#d6d6d6 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}.thumb canvas{max-width:100%;max-height:100%}.layer-detail{min-width:0;flex:1}.layer-title{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer-sub{font-size:10px;color:#9daec7;margin-top:3px}.empty-layers{padding:28px 12px;color:var(--sub);text-align:center}.props{height:42%;min-height:235px;max-height:53%;overflow:auto;border-top:1px solid var(--line)}.property-body{padding:0 14px 20px}.group-title{font-size:10px;color:#91a0bb;text-transform:uppercase;letter-spacing:.9px;font-weight:750;margin:13px 0 9px}.prop-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:11px;color:#9da9be}.field input,.field select,.field textarea{width:100%;background:#111720;color:#f3f7ff;border:1px solid #364155;padding:7px 9px;border-radius:7px;min-height:33px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#62bafa}.field textarea{min-height:77px;resize:vertical;line-height:1.5}.field input[type="color"]{padding:3px;height:35px}.field input[type="range"]{accent-color:#7cbbf4;padding:0;border:none;background:none;min-height:25px}.field.wide{grid-column:1/-1}.small-note{font-size:11px;line-height:1.7;color:#94a1b7;margin:8px 0}.note-pill{font-size:10px;color:#ecce95;background:#bc904220;padding:6px 8px;border-radius:5px;margin:10px 0;line-height:1.5}.empty-props{color:#92a0b7;padding:12px 0;line-height:1.8}.zoom{display:flex;align-items:center;gap:5px}.zoom .btn{height:26px;padding:0 7px}.zoom span{font-variant-numeric:tabular-nums;min-width:39px;text-align:center;color:#c8d4e7}.toast{position:fixed;bottom:51px;left:50%;transform:translateX(-50%) translateY(18px);opacity:0;z-index:12;padding:11px 17px;border-radius:10px;border:1px solid #496278;background:#243243f2;box-shadow:var(--shadow);max-width:calc(100% - 40px);transition:.2s;pointer-events:none;font-size:12px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.drop-cover{display:none;position:fixed;inset:0;background:#101725d9;z-index:9;align-items:center;justify-content:center;border:5px dashed #70bbfa;pointer-events:none}.drop-cover.on{display:flex}.drop-card{font-size:24px;font-weight:800;text-align:center}.drop-card small{font-size:14px;color:#b9cbdf;font-weight:400;display:block;margin-top:15px}.modal-bg{position:fixed;inset:0;background:#070911c7;z-index:15;display:none;align-items:center;justify-content:center;padding:30px}.modal-bg.on{display:flex}.modal{background:#1d2532;border:1px solid #495872;box-shadow:var(--shadow);width:430px;max-width:100%;border-radius:15px;padding:23px}.modal h2{font-size:19px;margin:0 0 8px}.modal p{color:#abbad0;line-height:1.8;margin:6px 0 19px;font-size:12px}.modal input{background:#101721;color:white;border:1px solid #45536b;border-radius:7px;padding:9px 10px;width:100%;margin:4px 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.busy-overlay{position:absolute;inset:0;background:#10141bd6;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;gap:13px;font-weight:700}.busy-overlay.on{display:flex}.spin{height:32px;width:32px;border:3px solid #516179;border-top-color:#82c9fa;border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.hdr-note{color:#9aacca;font-size:11px}.resizable{resize:none}@media(max-width:1020px){.rightpanel{width:259px}.brand{min-width:auto}.brand-sub{display:none}.topbar{gap:6px;padding:0 9px}.sep.optional,.optional{display:none}.board-inner{padding:45px 55px}}@media(max-height:680px){.props{height:48%;min-height:190px}.topbar{height:52px}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
 <div class="brand"><div class="brand-logo">P</div><div><div class="brand-name">PixelCraft <span style="font-weight:400;color:#b8c5d8">Studio</span></div><div class="brand-sub">PSD 圖層美工工作台 · 繁體中文版</div></div></div>
 <span class="tag optional">本機處理 · 不上傳檔案</span><div class="sep"></div>
 <button class="btn" id="newBtn" title="建立新專案">＋ 新增</button><button class="btn" id="openBtn" title="開啟 PSD／圖片 (Ctrl+O)">▣ 開啟 PSD</button>
 <div class="grow"></div><button class="btn icon ghost" title="復原 Ctrl+Z" id="undoBtn">↶</button><button class="btn icon ghost" title="重做 Ctrl+Shift+Z" id="redoBtn">↷</button><div class="sep"></div>
 <button class="btn optional" id="exportPng">匯出 PNG</button><button class="btn optional" id="exportJpg">JPG</button><button class="btn primary" id="exportPsd" title="輸出分層 PSD（文字將轉成圖層點陣圖）">⇩ 匯出 PSD</button>
</header>
<div class="workspace">
 <nav class="tools" aria-label="編輯工具">
  <button class="tool active" data-tool="select" title="選取與移動 (V)"><span class="symbol">↖</span><span>選取 V</span></button>
  <button class="tool" data-tool="text" title="文字 (T)"><span class="symbol">T</span><span>文字 T</span></button>
  <button class="tool" data-tool="rect" title="矩形 (R)"><span class="symbol">▢</span><span>矩形 R</span></button>
  <button class="tool" data-tool="ellipse" title="橢圓 (O)"><span class="symbol">◯</span><span>橢圓 O</span></button>
  <div class="tool-sep"></div>
  <button class="tool" id="addImageTool" title="匯入 JPG / PNG / WebP 圖片"><span class="symbol">▧</span><span>圖片</span></button>
  <button class="tool" data-tool="hand" title="平移畫布 (H 或按住空白鍵)"><span class="symbol">✋</span><span>平移 H</span></button>
  <div class="tool-sep"></div>
  <button class="tool" id="duplicateTool" title="複製所選圖層"><span class="symbol">⧉</span><span>複製</span></button>
  <button class="tool" id="deleteTool" title="刪除所選圖層"><span class="symbol">⌫</span><span>刪除</span></button>
 </nav>
 <main class="main">
  <div class="docbar"><span class="doc-name" id="docName">未命名設計</span><span class="doc-info" id="docMeta">1200 × 800 px</span><div class="grow"></div><span class="hdr-note optional" id="toolHint">選取圖層後可拖曳移動與縮放</span></div>
  <div class="board-outer" id="stage"><div class="stage-tip" id="stageTip"></div><div class="board-inner" id="boardInner"><div class="artboard" id="artboard"><canvas id="artCanvas"></canvas><div class="selection" id="selection" hidden><div class="selection-label" id="selectionLabel"></div><div class="handle" data-h="nw"></div><div class="handle" data-h="ne"></div><div class="handle" data-h="sw"></div><div class="handle" data-h="se"></div></div></div></div><div class="busy-overlay" id="busy"><div class="spin"></div><span id="busyMessage">正在處理 PSD…</span></div></div>
  <div class="statusbar"><div class="status-left"><span><span class="dot" id="readyDot"></span><span id="status">準備就緒</span></span><span id="layerCount">0 個圖層</span></div><div class="status-right"><span id="mousePosition" class="optional">X: —　Y: —</span><div class="zoom"><button class="btn icon ghost" id="zoomOut" title="縮小">−</button><span id="zoomValue">100%</span><button class="btn icon ghost" id="zoomIn" title="放大">＋</button><button class="btn mini" id="fitBtn">適合畫面</button></div></div></div>
 </main>
 <aside class="rightpanel"><section class="panel-section" style="flex:none"><div class="panel-head"><strong>圖層 <span class="faded" id="layerNum"></span></strong><span class="faded">上層在前</span></div><div class="layer-controls"><button class="btn mini" id="layerUp" title="圖層向上一層">↑ 上移</button><button class="btn mini" id="layerDown" title="圖層向下一層">↓ 下移</button><button class="btn mini" id="addTextSmall" title="新增文字">＋ 文字</button></div></section>
 <div class="layers" id="layers"></div><section class="props"><div class="panel-head"><strong>屬性編輯</strong><span class="faded" id="propKind">未選取</span></div><div class="property-body" id="props"></div></section></aside>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="drop-cover" id="dropCover"><div class="drop-card">放開即可開啟設計檔<small>支援 PSD、PNG、JPG、WebP</small></div></div>
<div class="modal-bg" id="newModal"><div class="modal"><h2>建立新畫布</h2><p>設定設計尺寸，之後就能新增文字、圖形或圖片圖層。</p><div class="field"><label for="newName">專案名稱</label><input id="newName" value="我的美工作品"></div><div class="prop-row"><div class="field"><label for="newW">寬度（px）</label><input id="newW" type="number" min="64" max="8000" value="1200"></div><div class="field"><label for="newH">高度（px）</label><input id="newH" type="number" min="64" max="8000" value="800"></div></div><div class="modal-actions"><button class="btn" id="cancelNew">取消</button><button class="btn primary" id="createNew">建立畫布</button></div></div></div>
<input id="fileInput" type="file" accept=".psd,image/png,image/jpeg,image/webp" hidden><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<!-- 開啟 PSD 與匯出 PSD 使用 ag-psd，若網路無法存取 CDN，仍可使用 PNG/JPG 與內建編輯器。 -->
<script src="https://cdn.jsdelivr.net/npm/ag-psd@31.0.2/dist/bundle.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), C=$('artCanvas'), ctx=C.getContext('2d'), board=$('artboard'), stage=$('stage'), layerPanel=$('layers');
let W=1200,H=800,docName='品牌海報範例',layers=[],sel=null,tool='select',zoom=.6,nextId=1,drag=null,undoStack=[],redoStack=[],dirty=false,busy=false,spaceHeld=false,toastT=null,propertyFocus=false;
const MAX_HISTORY=40, MAX_SIZE=8000;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), uid=()=>nextId++;
const htmlEscape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(type,extra={})=>({id:uid(),type,name:'新圖層',visible:true,locked:false,opacity:1,blend:'normal',x:100,y:100,w:240,h:120,color:'#71b8f5',text:'請輸入文字',fontSize:48,fontFamily:'Arial, Noto Sans TC, Microsoft JhengHei, sans-serif',bold:false,image:null,sourceText:null,...extra});
function allState(){return {W,H,docName,layers:layers.map(l=>({...l})),sel,nextId,dirty};}
function checkpoint(){undoStack.push(allState());if(undoStack.length>MAX_HISTORY)undoStack.shift();redoStack=[];refreshHistory();}
function restore(st){({W,H,docName,layers,sel,nextId,dirty}=st);refreshAll();}
function undo(){if(!undoStack.length)return;redoStack.push(allState());restore(undoStack.pop());refreshHistory();toast('已復原');}
function redo(){if(!redoStack.length)return;undoStack.push(allState());restore(redoStack.pop());refreshHistory();toast('已重做');}
function refreshHistory(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length;}
function current(){return layers.find(l=>l.id===sel)||null;}
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3300);$('status').textContent=s;}
function setBusy(on,message='正在處理…'){busy=on;$('busy').classList.toggle('on',on);$('busyMessage').textContent=message;}
function resetDocument(name,w,h,newLayers=[]){W=w;H=h;docName=name;layers=newLayers;sel=null;undoStack=[];redoStack=[];dirty=false;refreshAll();fit();refreshHistory();}
function add(layer){checkpoint();layers.unshift(layer);sel=layer.id;dirty=true;refreshAll();}
function select(id){sel=id;refreshLayers();refreshProps();renderSelection();}
function changeTool(t){tool=t;document.querySelectorAll('.tool[data-tool]').forEach(e=>e.classList.toggle('active',e.dataset.tool===t));const hints={select:'選取圖層後可拖曳移動與縮放',text:'點擊畫布新增文字',rect:'在畫布上拖曳繪製矩形',ellipse:'在畫布上拖曳繪製橢圓',hand:'拖曳平移畫布'};$('toolHint').textContent=hints[t]||'';board.style.cursor=t==='hand'?'grab':t==='select'?'default':'crosshair';}
function redraw(){C.width=W;C.height=H;ctx.clearRect(0,0,W,H);for(let i=layers.length-1;i>=0;i--)drawLayer(ctx,layers[i]);}
function drawText(context,l,x=0,y=0){let size=clamp(+l.fontSize||36,2,700);context.fillStyle=l.color||'#fff';context.textBaseline='top';context.font=`${l.bold?'bold ':''}${size}px ${l.fontFamily||'sans-serif'}`;let lineHeight=size*1.23;const raw=String(l.text||'').split('\n'), lines=[];for(const p of raw){if(!p){lines.push('');continue;}let buf='';for(const ch of Array.from(p)){if(buf&&context.measureText(buf+ch).width>Math.max(10,l.w)){lines.push(buf);buf=ch;}else buf+=ch;}lines.push(buf);}lines.forEach((line,i)=>{if(i*lineHeight+l.fontSize<=l.h+4)context.fillText(line,x,y+i*lineHeight);});}
function renderLayerLocal(context,l){const w=Math.max(1,l.w),h=Math.max(1,l.h);switch(l.type){case'image':if(l.image)context.drawImage(l.image,0,0,w,h);break;case'text':drawText(context,l);break;case'rect':context.fillStyle=l.color;context.fillRect(0,0,w,h);break;case'ellipse':context.fillStyle=l.color;context.beginPath();context.ellipse(w/2,h/2,w/2,h/2,0,0,Math.PI*2);context.fill();break;}}
function drawLayer(context,l){if(!l.visible||l.opacity<=0||l.w<=0||l.h<=0)return;context.save();context.globalAlpha=clamp(l.opacity,0,1);context.globalCompositeOperation=l.blend||'source-over';if(!['source-over','multiply','screen','overlay','darken','lighten','color-dodge','color-burn','hard-light','soft-light','difference','exclusion','hue','saturation','color','luminosity'].includes(context.globalCompositeOperation))context.globalCompositeOperation='source-over';context.translate(l.x,l.y);renderLayerLocal(context,l);context.restore();}
function bounds(l){let x=l.x*zoom,y=l.y*zoom,w=l.w*zoom,h=l.h*zoom;return {x,y,w,h};}
function renderSelection(){let l=current(),e=$('selection');if(!l||!l.visible){e.hidden=true;return;}e.hidden=false;let b=bounds(l);e.style.left=b.x+'px';e.style.top=b.y+'px';e.style.width=Math.max(1,b.w)+'px';e.style.height=Math.max(1,b.h)+'px';$('selectionLabel').textContent=l.name;for(const h of e.querySelectorAll('.handle'))h.style.display=l.locked?'none':'';}
function render(){board.style.width=(W*zoom)+'px';board.style.height=(H*zoom)+'px';redraw();renderSelection();$('docName').textContent=docName+(dirty?' •':'');$('docMeta').textContent=`${W} × ${H} px · RGB`; $('zoomValue').textContent=Math.round(zoom*100)+'%';$('layerCount').textContent=layers.length+' 個圖層';}
function iconFor(l){return l.type==='text'?'T':l.type==='rect'?'▢':l.type==='ellipse'?'◯':'▧';}
function thumb(l){const temp=document.createElement('canvas');temp.width=40;temp.height=36;const c=temp.getContext('2d');if(l.type==='image'&&l.image){let k=Math.min(40/l.w,36/l.h);c.drawImage(l.image,(40-l.w*k)/2,(36-l.h*k)/2,l.w*k,l.h*k);}else if(l.type==='text'){c.fillStyle=l.color;c.font='bold 21px sans-serif';c.fillText('T',13,26);}else if(l.type==='rect'){c.fillStyle=l.color;c.fillRect(7,6,26,24);}else{c.fillStyle=l.color;c.beginPath();c.ellipse(20,18,14,13,0,0,2*Math.PI);c.fill();}return temp;}
function refreshLayers(){layerPanel.innerHTML='';$('layerNum').textContent=String(layers.length);if(!layers.length){layerPanel.innerHTML='<div class="empty-layers">目前沒有圖層<br>使用左側工具開始設計</div>';return;}for(const l of layers){let row=document.createElement('div');row.className='layer-item'+(sel===l.id?' selected':'');row.title=l.name;let eye=document.createElement('button');eye.className='eye'+(l.visible?'':' off');eye.title=l.visible?'隱藏圖層':'顯示圖層';eye.textContent=l.visible?'◉':'◌';eye.addEventListener('click',e=>{e.stopPropagation();checkpoint();l.visible=!l.visible;dirty=true;refreshAll();});let t=document.createElement('div');t.className='thumb';t.appendChild(thumb(l));let info=document.createElement('div');info.className='layer-detail';let title=document.createElement('div');title.className='layer-title';title.textContent=l.name;let sub=document.createElement('div');sub.className='layer-sub';sub.textContent=(l.sourceText&&l.type==='image'?'PSD 文字(原始圖像)':({'image':'圖片圖層','text':'文字圖層','rect':'矩形圖層','ellipse':'橢圓圖層'}[l.type]||'圖層'))+' · '+Math.round(l.opacity*100)+'%';info.append(title,sub);let lock=document.createElement('button');lock.className='lock';lock.title=l.locked?'解鎖':'鎖定';lock.textContent=l.locked?'▣':'▢';lock.onclick=e=>{e.stopPropagation();checkpoint();l.locked=!l.locked;refreshAll();};row.append(eye,t,info,lock);row.onclick=()=>select(l.id);row.ondblclick=()=>{const name=prompt('圖層名稱',l.name);if(name!==null&&name.trim()){checkpoint();l.name=name.trim();dirty=true;refreshAll();}};layerPanel.appendChild(row);}}
function propsField(label,key,value,type='number',opts=''){return `<div class="field"><label for="f_${key}">${label}</label><input id="f_${key}" data-field="${key}" type="${type}" ${type==='number'?'step="1"':''} value="${htmlEscape(value)}" ${opts}></div>`;}
function refreshProps(){let l=current();$('propKind').textContent=l?(l.sourceText&&l.type==='image'?'可轉換文字':l.type):'未選取';if(!l){$('props').innerHTML='<p class="empty-props">選取圖層即可編輯位置、尺寸、色彩與透明度。<br><br>支援匯入 PSD，並保留可操作的獨立圖層。<br><br><span style="color:#eac891">提示：</span>PSD 特效、遮色片等僅能部分保留視覺結果。</p>';return;}

 if(l.sourceText&&l.type==='image')out+=`<div class="note-pill">此圖層原本是 Photoshop 文字。保持原狀可呈現匯入時的像素外觀；轉換後可修改文字，但字型與排版可能與原檔不同。</div><button class="btn" style="width:100%" id="convertText">✎ 轉為可編輯文字</button>`;

 if(l.type==='image')out+=`<div class="small-note">圖片可拖曳、縮放，並調整圖層透明度。編輯後以點陣圖圖層匯出 PSD。</div>`;
 out+=`<div style="display:flex;gap:8px;margin-top:15px"><button class="btn mini" id="duplicateProp" style="flex:1">⧉ 複製圖層</button><button class="btn mini" id="deleteProp" style="flex:1;color:#faa7ad">⌫ 刪除圖層</button></div>`;

 if(l.type==='text'){$('f_fontFamily').value=l.fontFamily;if(!$('f_fontFamily').value)$('f_fontFamily').value='Arial, Noto Sans TC, Microsoft JhengHei, sans-serif';}
 for(let e of $('props').querySelectorAll('[data-field]')){e.onfocus=()=>{if(!propertyFocus){checkpoint();propertyFocus=true;}};e.onblur=()=>{propertyFocus=false;};e.oninput=()=>{const k=e.dataset.field;const active=current();if(!active||active.locked){if(active?.locked)toast('圖層已鎖定');return;}let v=e.value;if(['x','y','w','h','fontSize','opacity'].includes(k)){v=Number(v);if(!Number.isFinite(v))return;if(k==='w'||k==='h')v=clamp(v,1,16000);if(k==='fontSize')v=clamp(v,2,700);if(k==='opacity')v=clamp(v,0,100)/100;}if(k==='bold')v=v==='true';active[k]=v;dirty=true;render();if(k==='name')refreshLayers();if(k==='opacity')e.previousElementSibling.textContent='不透明度 '+Math.round(active.opacity*100)+'%';};}
 $('convertText')?.addEventListener('click',convertText);

}
function refreshAll(){render();refreshLayers();refreshProps();refreshHistory();}
function fit(){let rect=stage.getBoundingClientRect();if(!rect.width||!rect.height)return;zoom=clamp(Math.min((rect.width-140)/W,(rect.height-140)/H),.05,2.5);render();stage.scrollLeft=(stage.scrollWidth-stage.clientWidth)/2;stage.scrollTop=(stage.scrollHeight-stage.clientHeight)/2;}
function setZoom(z){let ratio=clamp(z,.05,4);const before={x:stage.scrollLeft+stage.clientWidth/2,y:stage.scrollTop+stage.clientHeight/2};let old=zoom;zoom=ratio;render();stage.scrollLeft=before.x*zoom/old-stage.clientWidth/2;stage.scrollTop=before.y*zoom/old-stage.clientHeight/2;}
function pointerCoords(e){let r=board.getBoundingClientRect();return {x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom};}
function hitTest(x,y){return layers.find(l=>l.visible&&!l.locked&&x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<=l.y+l.h)||null;}
function pointerDown(e){if(e.button!==0||busy)return;let p=pointerCoords(e);if(tool==='hand'||spaceHeld){drag={mode:'hand',startX:e.clientX,startY:e.clientY,sx:stage.scrollLeft,sy:stage.scrollTop};board.style.cursor='grabbing';board.setPointerCapture(e.pointerId);e.preventDefault();return;}
 if(tool==='text'){if(p.x<0||p.y<0||p.x>W||p.y>H)return;const l=mk('text',{name:'新文字',x:Math.round(p.x),y:Math.round(p.y),w:Math.min(450,W-p.x),h:120,color:'#172635',text:'雙擊右側文字欄編輯',fontSize:clamp(W/22,20,56)});add(l);changeTool('select');$('f_text')?.focus();return;}
 if(tool==='rect'||tool==='ellipse'){checkpoint();const l=mk(tool,{name:tool==='rect'?'矩形':'橢圓',x:p.x,y:p.y,w:1,h:1,color:tool==='rect'?'#559ada':'#bb89e7'});layers.unshift(l);sel=l.id;dirty=true;drag={mode:'draw',id:l.id,start:p};board.setPointerCapture(e.pointerId);refreshAll();e.preventDefault();return;}
 let handle=e.target.closest?.('.handle');let cur=current();if(handle&&cur&&!cur.locked){checkpoint();drag={mode:'resize',id:cur.id,handle:handle.dataset.h,start:p,old:{x:cur.x,y:cur.y,w:cur.w,h:cur.h}};board.setPointerCapture(e.pointerId);e.preventDefault();return;}
 let h=hitTest(p.x,p.y);if(h){if(sel!==h.id)select(h.id);checkpoint();drag={mode:'move',id:h.id,start:p,old:{x:h.x,y:h.y}};board.setPointerCapture(e.pointerId);e.preventDefault();}else{select(null);}
}
function pointerMove(e){const p=pointerCoords(e);$('mousePosition').textContent=`X: ${Math.round(p.x)}　Y: ${Math.round(p.y)}`;if(!drag)return; if(drag.mode==='hand'){stage.scrollLeft=drag.sx-(e.clientX-drag.startX);stage.scrollTop=drag.sy-(e.clientY-drag.startY);return;}
 let l=layers.find(z=>z.id===drag.id);if(!l)return;
 if(drag.mode==='draw'){l.x=Math.min(drag.start.x,p.x);l.y=Math.min(drag.start.y,p.y);l.w=Math.max(1,Math.abs(p.x-drag.start.x));l.h=Math.max(1,Math.abs(p.y-drag.start.y));}
 else if(drag.mode==='move'){l.x=Math.round(drag.old.x+p.x-drag.start.x);l.y=Math.round(drag.old.y+p.y-drag.start.y);}
 else if(drag.mode==='resize'){const b=drag.old,hh=drag.handle;let nx=b.x,ny=b.y,nw=b.w,nh=b.h,dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(hh.includes('e'))nw=b.w+dx;else{nx=b.x+dx;nw=b.w-dx;}if(hh.includes('s'))nh=b.h+dy;else{ny=b.y+dy;nh=b.h-dy;}if(e.shiftKey){let ratio=b.w/b.h;if(Math.abs(nw-b.w)>Math.abs(nh-b.h)*ratio){nh=nw/ratio;if(hh.includes('n'))ny=b.y+b.h-nh;}else{nw=nh*ratio;if(hh.includes('w'))nx=b.x+b.w-nw;}}if(nw>=3&&nh>=3){l.x=Math.round(nx);l.y=Math.round(ny);l.w=Math.round(nw);l.h=Math.round(nh);}}
 dirty=true;render();e.preventDefault();}
function pointerUp(e){if(!drag)return;if(drag.mode==='draw'){let l=current();if(l&&(l.w<4||l.h<4)){l.w=150;l.h=100;}}if(drag.mode==='hand')board.style.cursor='grab';drag=null;refreshAll();try{board.releasePointerCapture(e.pointerId);}catch{}}
function del(){let l=current();if(!l)return;checkpoint();layers=layers.filter(x=>x.id!==sel);sel=null;dirty=true;refreshAll();toast('已刪除圖層');}
function duplicate(){let l=current();if(!l)return;checkpoint();const copy={...l,id:uid(),name:l.name+' 副本',x:l.x+22,y:l.y+22};layers.splice(Math.max(0,layers.indexOf(l)),0,copy);sel=copy.id;dirty=true;refreshAll();toast('已複製圖層');}
function moveLayer(d){let l=current();if(!l)return;let i=layers.indexOf(l),j=i+d;if(j<0||j>=layers.length)return;checkpoint();[layers[i],layers[j]]=[layers[j],layers[i]];dirty=true;refreshAll();}
function hexColor(c){if(c&&Number.isFinite(c.r)&&Number.isFinite(c.g)&&Number.isFinite(c.b))return '#'+[c.r,c.g,c.b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join('');return '#ffffff';}
function convertText(){let l=current();if(!l||!l.sourceText||l.locked)return;checkpoint();let t=l.sourceText;let st=t.style||t.styleRuns?.[0]?.style||{};l.type='text';l.text=String(t.text||l.name).replace(/\r/g,'\n');l.fontSize=clamp(Math.round(st.fontSize||Math.min(50,l.h*.72)),5,250);l.color=hexColor(st.fillColor)||'#ffffff';l.fontFamily='Noto Sans TC, Microsoft JhengHei, sans-serif';l.bold=!!st.fauxBold;l.name=l.name.replace(/\s*\[PSD文字\]$/,'');l.sourceText=null;dirty=true;refreshAll();toast('已轉為可編輯文字；字型與排版可能不同');}
function readFile(f){if(!f)return;let ext=f.name.split('.').pop().toLowerCase();if(ext==='psd')loadPsd(f);else if(f.type.startsWith('image/')||['png','jpg','jpeg','webp'].includes(ext))loadImageFile(f,false);else toast('僅支援 PSD、PNG、JPG、WebP');}
async function loadImageFile(f,asLayer=true){try{setBusy(true,'正在讀取圖片…');const img=await imageFromFile(f);if(!asLayer){if(img.width>MAX_SIZE||img.height>MAX_SIZE)throw Error('圖片尺寸超過 '+MAX_SIZE+'px 限制');resetDocument(f.name.replace(/\.[^.]+$/,''),img.width,img.height,[mk('image',{name:f.name,x:0,y:0,w:img.width,h:img.height,image:img})]);select(layers[0].id);toast('圖片已開啟，可繼續新增圖層');}else{let ratio=Math.min(1,W*.8/img.width,H*.8/img.height);add(mk('image',{name:f.name,x:Math.round((W-img.width*ratio)/2),y:Math.round((H-img.height*ratio)/2),w:Math.round(img.width*ratio),h:Math.round(img.height*ratio),image:img}));toast('已加入圖片圖層');}}catch(e){console.error(e);toast('無法讀取圖片：'+e.message);}finally{setBusy(false);}}
function imageFromFile(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('不支援的圖片格式'))};img.src=url;});}
function canvasFromImageData(data){const cv=document.createElement('canvas');cv.width=data.width;cv.height=data.height;cv.getContext('2d').putImageData(data,0,0);return cv;}
async function loadPsd(f){if(!window.agPsd?.readPsd){toast('PSD 解析套件尚未載入，請確認網路可連線');return;}try{setBusy(true,'正在解析 Photoshop PSD…');const buf=await f.arrayBuffer();await new Promise(r=>setTimeout(r,50));const psd=window.agPsd.readPsd(buf,{skipThumbnail:true,logMissingFeatures:false});if(psd.width>MAX_SIZE||psd.height>MAX_SIZE)throw Error('PSD 畫布超過 '+MAX_SIZE+'px，請先縮小');let found=[],groupCount=0,skipped=0;function walk(items,path='',parentVisible=true,depth=0){if(depth>30)return;for(const l of items||[]){const visible=parentVisible&&!l.hidden;if(l.children){groupCount++;walk(l.children,path+(l.name||'群組')+' / ',visible,depth+1);continue;}let image=l.canvas||l.imageData&&canvasFromImageData(l.imageData);let x=Number(l.left||0),y=Number(l.top||0),w=Number(l.right-l.left)||image?.width||1,h=Number(l.bottom-l.top)||image?.height||1;if(!image||image.width===0||image.height===0){skipped++;continue;}found.push(mk('image',{name:path+(l.name||'未命名圖層')+(l.text?' [PSD文字]':''),x,y,w,h,visible,locked:!!l.protected?.position,opacity:typeof l.opacity==='number'?l.opacity:1,blend:({normal:'source-over','pass through':'source-over'}[l.blendMode]||l.blendMode||'source-over'),image,sourceText:l.text||null}));}}
 walk(psd.children);if(!found.length){const image=psd.canvas||psd.imageData&&canvasFromImageData(psd.imageData);if(!image)throw Error('PSD 解析成功，但找不到可顯示的圖像資料');found=[mk('image',{name:'PSD 合併預覽',x:0,y:0,w:psd.width,h:psd.height,image})];}
 resetDocument(f.name.replace(/\.psd$/i,''),psd.width,psd.height,found);select(found[0].id);let note=`已開啟 ${found.length} 個圖層`+(groupCount?`（${groupCount} 個群組攤平顯示）`:'')+(skipped?`，忽略 ${skipped} 個無像素圖層`:'');toast(note);if(groupCount||skipped)console.info('PSD 匯入統計', {groups:groupCount,skipped});
 }catch(e){console.error('PSD 解析錯誤',e);toast('PSD 開啟失敗：'+(e?.message||String(e)));alert('PSD 開啟失敗。\n\n'+(e?.message||e)+'\n\n部分 Photoshop 智慧型物件、特殊色彩模式或 PSB 可能不受支援。');}finally{setBusy(false);}}
function filename(ext){return (docName||'美工設計').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function toBlob(cv,type,quality=.94){return new Promise((resolve,reject)=>cv.toBlob(b=>b?resolve(b):reject(Error('圖片輸出失敗')),type,quality));}
async function exportImage(type){try{setBusy(true,'正在製作 '+type.toUpperCase()+'…');await new Promise(r=>setTimeout(r,30));redraw();if(type==='png'){download(await toBlob(C,'image/png'),filename('png'));}else{const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,W,H);c.drawImage(C,0,0);download(await toBlob(cv,'image/jpeg',.95),filename('jpg'));}toast('匯出完成');}catch(e){console.error(e);toast('匯出失敗：'+e.message);}finally{setBusy(false);}}
function rasterLayer(l){const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(l.w));cv.height=Math.max(1,Math.round(l.h));const c=cv.getContext('2d');c.scale(cv.width/Math.max(1,l.w),cv.height/Math.max(1,l.h));renderLayerLocal(c,l);return cv;}
async function exportPSD(){if(!window.agPsd?.writePsd){toast('PSD 匯出套件尚未載入，請確認網路連線');return;}if(!layers.length){toast('請先新增圖層');return;}try{setBusy(true,'正在建立分層 PSD…');await new Promise(r=>setTimeout(r,40));redraw();const comp=document.createElement('canvas');comp.width=W;comp.height=H;comp.getContext('2d').drawImage(C,0,0);

$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{readFile(e.target.files[0]);e.target.value='';};$('addImageTool').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{if(e.target.files[0])loadImageFile(e.target.files[0],true);e.target.value='';};
$('newBtn').onclick=()=>$('newModal').classList.add('on');$('cancelNew').onclick=()=>$('newModal').classList.remove('on');$('newModal').onclick=e=>{if(e.target===$('newModal'))$('newModal').classList.remove('on');};$('createNew').onclick=()=>{const w=Math.round(Number($('newW').value)),h=Math.round(Number($('newH').value));if(!Number.isFinite(w)||!Number.isFinite(h)||w<64||h<64||w>MAX_SIZE||h>MAX_SIZE){toast('畫布尺寸須介於 64 ～ '+MAX_SIZE+' px');return;}resetDocument($('newName').value.trim()||'未命名設計',w,h,[]);$('newModal').classList.remove('on');toast('已建立空白畫布');};
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('exportPsd').onclick=exportPSD;$('exportPng').onclick=()=>exportImage('png');$('exportJpg').onclick=()=>exportImage('jpg');$('zoomIn').onclick=()=>setZoom(zoom*1.25);$('zoomOut').onclick=()=>setZoom(zoom/1.25);$('fitBtn').onclick=fit;$('duplicateTool').onclick=duplicate;$('deleteTool').onclick=del;$('layerUp').onclick=()=>moveLayer(-1);$('layerDown').onclick=()=>moveLayer(1);$('addTextSmall').onclick=()=>add(mk('text',{name:'新文字',x:Math.round(W/4),y:Math.round(H/3),w:Math.round(W/2),h:100,text:'請在右側編輯文字',color:'#ffffff'}));document.querySelectorAll('.tool[data-tool]').forEach(b=>b.onclick=()=>changeTool(b.dataset.tool));
board.addEventListener('pointerdown',pointerDown);board.addEventListener('pointermove',pointerMove);board.addEventListener('pointerup',pointerUp);board.addEventListener('pointercancel',pointerUp);board.addEventListener('dblclick',e=>{const l=current();if(l?.type==='text'){$('f_text')?.focus();$('f_text')?.select();}else if(l?.sourceText)convertText();});
stage.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:.9));}},{passive:false});
window.addEventListener('keydown',e=>{let t=e.target,typing=t.matches('input,textarea,select')||t.isContentEditable;if(e.key===' '&&!typing){spaceHeld=true;if(tool!=='hand')board.style.cursor='grab';e.preventDefault();}let mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();$('fileInput').click();return;}if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();exportPSD();return;}if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}if(typing||mod||e.altKey)return;let k=e.key.toLowerCase();if(k==='v')changeTool('select');else if(k==='t')changeTool('text');else if(k==='r')changeTool('rect');else if(k==='o')changeTool('ellipse');else if(k==='h')changeTool('hand');else if(k==='delete'||k==='backspace'){e.preventDefault();del();}else if(k==='escape')select(null);else if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){let l=current();if(l&&!l.locked){e.preventDefault();checkpoint();const d=e.shiftKey?10:1;if(k==='arrowup')l.y-=d;if(k==='arrowdown')l.y+=d;if(k==='arrowleft')l.x-=d;if(k==='arrowright')l.x+=d;dirty=true;refreshAll();}}});window.addEventListener('keyup',e=>{if(e.key===' '){spaceHeld=false;board.style.cursor=tool==='hand'?'grab':tool==='select'?'default':'crosshair';}});
let dragCounter=0;window.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();dragCounter++;$('dropCover').classList.add('on');}});window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});window.addEventListener('dragleave',e=>{e.preventDefault();dragCounter=Math.max(0,dragCounter-1);if(!dragCounter)$('dropCover').classList.remove('on');});window.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;$('dropCover').classList.remove('on');let f=e.dataTransfer?.files?.[0];if(f)readFile(f);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
createDemo();setTimeout(fit,100);window.addEventListener('resize',()=>{if(stage.clientWidth>200&&zoom>2.5)fit();});
})();
</script>
</body></html>
