        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';

            let optionsHtml = '';
            for (const [key, value] of Object.entries(item.options)) {
                optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index}, '${key}', this)">(${key}) ${value}</button>`;
            }

            card.innerHTML = `
                <div class="badge">${item.page}</div>
                <div class="question">${index + 1}. ${item.question}</div>
                <div class="options" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div class="feedback" id="feedback-${index}"></div>
                <div class="explanation" id="exp-${index}">
                    <h4>📝 深入解析與問答題對照</h4>
                    ${item.explanation}
                </div>
            `;
            container.appendChild(card);
        });

        function checkAnswer(qIndex, selectedOption, btnElement) {
            const item = quizData[qIndex];
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const exp = document.getElementById(`exp-${qIndex}`);

            // 禁用所有按鈕，防止重複點擊
            buttons.forEach(btn => btn.disabled = true);

            // 判斷對錯
            if (selectedOption === item.answer) {
                btnElement.classList.add('correct');
                feedback.innerHTML = '✅ 答對了！非常棒！';
                feedback.style.color = '#155724';
            } else {
                btnElement.classList.add('wrong');
                // 標示出正確答案
                buttons.forEach(btn => {
                    if (btn.innerText.startsWith(`(${item.answer})`)) {
                        btn.classList.add('correct');
                    }
                });
                feedback.innerHTML = `❌ 答錯囉，正確答案是 <span class="highlight">(${item.answer})</span>`;
                feedback.style.color = '#721c24';
            }

            // 顯示回饋與解析
            feedback.style.display = 'block';
            exp.style.display = 'block';
        }
    </script>
