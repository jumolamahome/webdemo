<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 職能模擬測驗系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfbf7;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 350px;
            max-height: 400px;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 隱藏捲軸但保持功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col">
        <!-- 內容將由 JavaScript 動態渲染 -->
    </div>

    <script>
        // --- 完整題庫數據 ---
        const QUESTION_BANK = [
            { id: 1, level: "L1", question: "在 AI 專案管理中，定義問題的階段通常在哪個環節？", A: "專案啟動", B: "數據清理", C: "模型部署", D: "模型優化", ans: "A" },
            { id: 2, level: "L1", question: "機器學習中，標記數據 (Labeled Data) 主要用於哪種學習方式？", A: "非監督式學習", B: "監督式學習", C: "強化學習", D: "半監督式學習", ans: "B" },
            { id: 3, level: "L1", question: "下列何者屬於生成式 AI (AIGC) 的典型應用？", A: "基於規則的加法運算", B: "依據提示詞生成圖像", C: "讀取條碼資訊", D: "固定程序的自動化操作", ans: "B" },
            { id: 4, level: "L2", question: "在神經網路中，『權重』的主要作用是什麼？", A: "決定學習率", B: "調節輸入信號的重要性", C: "定義神經元數量", D: "儲存模型架構", ans: "B" },
            { id: 5, level: "L2", question: "『過擬合』 (Overfitting) 最主要的特徵是？", A: "訓練集表現差，測試集表現好", B: "訓練集表現好，測試集表現差", C: "模型運算速度過快", D: "數據標籤錯誤", ans: "B" },
            { id: 6, level: "L2", question: "下列哪種技術最常用於處理圖像數據？", A: "RNN", B: "CNN (卷積神經網路)", C: "線性回歸", D: "決策樹", ans: "B" },
            { id: 7, level: "L3", question: "建立 Data Pipeline 的主要目的是？", A: "減少存儲空間", B: "確保數據流轉的自動化與穩定性", C: "防止病毒入侵", D: "取代所有的人工決策", ans: "B" },
            { id: 8, level: "L3", question: "關於 RAG (檢索增強生成)，其核心價值在於？", A: "優化翻譯能力", B: "透過外部知識庫輔助生成精確內容", C: "減少模型參數", D: "提高運行頻率", ans: "B" },
            { id: 9, level: "L3", question: "向量資料庫 (Vector Database) 適合處理什麼？", A: "傳統關聯式表格", B: "高維度數據的相似度檢索", C: "簡單加減計算", D: "靜態網頁存儲", ans: "B" },
            { id: 10, level: "L4", question: "評估模型性能時，若正負樣本極度不均，應參考哪項指標？", A: "Accuracy (準確率)", B: "F1-Score (F1 分數)", C: "Latency (延遲)", D: "Loss (損失函數)", ans: "B" },
            { id: 11, level: "L4", question: "LLM 的微調 (Fine-tuning) 是指？", A: "修改提示詞", B: "在特定數據上進一步訓練模型權重", C: "增加記憶體", D: "更換開發語言", ans: "B" },
            { id: 12, level: "L4", question: "下列何者描述了 Prompt Engineering 的核心？", A: "撰寫 C++ 代碼", B: "設計優質提示詞以獲得更好的輸出", C: "優化 GPU 算力", D: "清理緩存數據", ans: "B" },
            { id: 13, level: "L5", question: "AI 倫理中的『可解釋性』是指？", A: "代碼是否公開", B: "人類是否能理解模型做出判斷的原因", C: "運行時是否耗電", D: "文本是否通順", ans: "B" },
            { id: 14, level: "L5", question: "在企業數位轉型中，AI 最適合扮演什麼角色？", A: "取代人類決策", B: "作為提升效率與創造價值的賦能引擎", C: "單純成本支出", D: "臨時性宣傳", ans: "B" },
            { id: 15, level: "L5", question: "面對生成式 AI 興起，人才最重要的能力是？", A: "背誦代碼", B: "問題定義與批判性思考能力", C: "數據輸入速度", D: "硬體維護", ans: "B" }
        ];

        // --- 應用程式狀態 ---
        let state = {
            view: 'home', // home, quiz, result
            questions: [],
            currentIndex: 0,
            answers: {},
            flags: {},
            timeLeft: 1800,
            timerInterval: null
        };

        const appContainer = document.getElementById('app');

        // --- 核心函數 ---

        function startExam() {
            // 隨機抽題邏輯：L1-L5 各隨機選 2 題
            const selected = [];
            ['L1', 'L2', 'L3', 'L4', 'L5'].forEach(lv => {
                const pool = QUESTION_BANK.filter(q => q.level === lv);
                const shuffled = pool.sort(() => Math.random() - 0.5);
                selected.push(...shuffled.slice(0, 2));
            });
            
            state.questions = selected.sort(() => Math.random() - 0.5);
            state.answers = {};
            state.flags = {};
            state.currentIndex = 0;
            state.timeLeft = 1800;
            state.view = 'quiz';
            
            render();
            startTimer();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                const timerEl = document.getElementById('timer-text');
                if (timerEl) {
                    timerEl.innerText = formatTime(state.timeLeft);
                    if (state.timeLeft < 300) timerEl.classList.add('text-red-500', 'animate-pulse');
                }
                if (state.timeLeft <= 0) submitExam(true);
            }, 1000);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const rs = s % 60;
            return `${m}:${rs.toString().padStart(2, '0')}`;
        }

        function selectAnswer(opt) {
            state.answers[state.currentIndex] = opt;
            render();
            
            // 檢查是否全部答完
            if (Object.keys(state.answers).length === 10) {
                setTimeout(() => {
                    if (confirm("您已完成所有作答，是否現在交卷？")) submitExam();
                }, 300);
            }
        }

        function toggleFlag() {
            state.flags[state.currentIndex] = !state.flags[state.currentIndex];
            render();
        }

        function submitExam(isAuto = false) {
            if (!isAuto && !confirm("確定要提交考卷結束測驗嗎？")) return;
            clearInterval(state.timerInterval);
            state.view = 'result';
            render();
        }

        // --- 渲染視圖 ---

        function render() {
            appContainer.innerHTML = '';
            
            if (state.view === 'home') renderHome();
            else if (state.view === 'quiz') renderQuiz();
            else if (state.view === 'result') renderResult();
        }

        function renderHome() {
            const html = `
                <div class="flex-grow flex items-center justify-center p-6">
                    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-10 text-center border border-slate-100 fade-in">
                        <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-8 transform rotate-3 text-blue-600">
                            <span class="text-4xl">🏆</span>
                        </div>
                        <h1 class="text-3xl font-black text-slate-800 mb-4 tracking-tight">AI 職能認證模擬測驗</h1>
                        <p class="text-slate-500 mb-10 leading-relaxed">
                            這是一個專業的職能評量系統。<br/>
                            我們將從五個維度隨機抽取 10 個題目。<br/>
                            及格標準：<span class="text-blue-600 font-bold">70 分</span> | 限時：<span class="text-red-500 font-bold">30 分鐘</span>
                        </p>
                        <button onclick="startExam()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2 text-xl">
                            立即開始測驗 🚀
                        </button>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderQuiz() {
            const q = state.questions[state.currentIndex];
            const html = `
                <div class="flex flex-col min-h-screen">
                    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-20 shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-widest">${q.level}</span>
                            <span class="font-bold text-slate-400 font-mono">Q${state.currentIndex + 1}/10</span>
                        </div>
                        <div id="timer-text" class="px-4 py-1 rounded-full font-mono text-xl font-black bg-slate-50 text-slate-700">
                            ${formatTime(state.timeLeft)}
                        </div>
                        <button onclick="toggleFlag()" class="p-2 rounded-lg ${state.flags[state.currentIndex] ? 'bg-orange-100 text-orange-600' : 'text-slate-200'} transition-all">
                            🚩
                        </button>
                    </header>

                    <div class="h-1.5 w-full bg-slate-100">
                        <div class="h-full bg-blue-600 transition-all duration-500" style="width: ${(state.currentIndex + 1) * 10}%"></div>
                    </div>

                    <main class="flex-1 max-w-3xl w-full mx-auto p-6 mt-4">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 md:p-10 mb-8 fade-in">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-snug mb-10">${q.question}</h2>
                            <div class="grid gap-4">
                                ${['A', 'B', 'C', 'D'].map(opt => `
                                    <button onclick="selectAnswer('${opt}')" class="flex items-center gap-4 w-full text-left p-5 rounded-2xl border-2 transition-all ${state.answers[state.currentIndex] === opt ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-50 hover:border-slate-200 bg-slate-50 text-slate-600'}">
                                        <span class="w-8 h-8 rounded-lg flex items-center justify-center font-black ${state.answers[state.currentIndex] === opt ? 'bg-blue-600 text-white' : 'bg-white text-slate-300 border'}">${opt}</span>
                                        ${q[opt]}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="grid grid-cols-5 md:grid-cols-10 gap-2 mb-10">
                            ${state.questions.map((_, i) => `
                                <button onclick="state.currentIndex = ${i}; render();" class="h-10 rounded-xl text-xs font-bold transition-all border-2 relative ${state.currentIndex === i ? 'border-blue-500 ring-2 ring-blue-100' : 'border-transparent'} ${state.answers[i] ? 'bg-emerald-500 text-white' : 'bg-white text-slate-300 border-slate-100'}">
                                    ${i + 1}
                                    ${state.flags[i] ? '<div class="absolute -top-1 -right-1 w-3 h-3 bg-orange-500 rounded-full border-2 border-white"></div>' : ''}
                                </button>
                            `).join('')}
                        </div>
                    </main>

                    <footer class="bg-white border-t p-6 sticky bottom-0 z-20 shadow-lg">
                        <div class="max-w-3xl mx-auto flex items-center justify-between">
                            <button onclick="if(state.currentIndex > 0){state.currentIndex--; render();}" ${state.currentIndex === 0 ? 'disabled' : ''} class="px-5 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-50 disabled:opacity-20 transition-all">上一題</button>
                            <button onclick="submitExam()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl font-black shadow-lg transition-all active:scale-95">提交交卷</button>
                            <button onclick="if(state.currentIndex < 9){state.currentIndex++; render();}" ${state.currentIndex === 9 ? 'disabled' : ''} class="px-5 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-50 disabled:opacity-20 transition-all">下一題</button>
                        </div>
                    </footer>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderResult() {
            let score = 0;
            const levelStats = { L1: 0, L2: 0, L3: 0, L4: 0, L5: 0 };
            state.questions.forEach((q, i) => {
                if (state.answers[i] === q.ans) {
                    score += 10;
                    levelStats[q.level]++;
                }
            });

            const isPass = score >= 70;
            const color = isPass ? 'emerald' : 'rose';

            const html = `
                <div class="min-h-screen bg-slate-50 p-6 md:p-10 fade-in">
                    <div class="max-w-4xl mx-auto space-y-8 pb-20">
                        <div class="rounded-[2.5rem] p-10 md:p-12 text-white shadow-2xl relative overflow-hidden bg-${color}-600">
                            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
                                <div>
                                    <h1 class="text-5xl font-black mb-4">${isPass ? '測驗及格' : '測驗不及格'}</h1>
                                    <p class="text-lg opacity-80">您的得分為 <span class="font-bold underline">${score}</span> / 100 分</p>
                                </div>
                                <div class="bg-white/20 px-8 py-6 rounded-3xl border border-white/30 backdrop-blur-sm">
                                    <div class="text-[10px] font-black uppercase tracking-widest opacity-60 mb-1">分值權重</div>
                                    <div class="text-6xl font-black">${score}</div>
                                </div>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">📊 章節能力分布</h3>
                                <div class="chart-container">
                                    <canvas id="radarCanvas"></canvas>
                                </div>
                            </div>

                            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-800 mb-6">主題掌握度</h3>
                                    <div class="space-y-5">
                                        ${Object.entries(levelStats).map(([lv, count]) => `
                                            <div class="space-y-1">
                                                <div class="flex justify-between text-[10px] font-black text-slate-400 tracking-widest uppercase">
                                                    <span>${lv} 階段</span>
                                                    <span>${count}/2</span>
                                                </div>
                                                <div class="h-3 bg-slate-50 rounded-full overflow-hidden p-0.5 shadow-inner">
                                                    <div class="h-full rounded-full ${count === 2 ? 'bg-emerald-500' : count === 1 ? 'bg-blue-500' : 'bg-rose-400'}" style="width: ${(count / 2) * 100}%"></div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <button onclick="state.view = 'home'; render();" class="w-full mt-10 bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl transition-all shadow-xl active:scale-95">重新測驗</button>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                            <h3 class="text-xl font-bold text-slate-800 mb-6">答案快速校對</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                ${state.questions.map((q, i) => `
                                    <div class="p-4 rounded-2xl border-2 flex flex-col items-center gap-1 ${state.answers[i] === q.ans ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-rose-50 border-rose-100 text-rose-600'}">
                                        <span class="text-[10px] font-black opacity-40 uppercase">Q${i+1}</span>
                                        <span class="text-xl font-black">${state.answers[i] === q.ans ? '✓' : '✗'}</span>
                                        <span class="text-[10px] font-bold opacity-70">正確: ${q.ans}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;

            // 繪製雷達圖
            const ctx = document.getElementById('radarCanvas').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['L1 基礎', 'L2 核心', 'L3 架構', 'L4 應用', 'L5 策略'],
                    datasets: [{
                        label: '正確率',
                        data: ['L1', 'L2', 'L3', 'L4', 'L5'].map(lv => (levelStats[lv] / 2) * 100),
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 3,
                        pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 100,
                            ticks: { stepSize: 25, display: false },
                            grid: { color: '#f1f5f9' },
                            pointLabels: { font: { size: 12, weight: '900' }, color: '#64748b' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 初始化
        render();

    </script>
</body>
</html>
