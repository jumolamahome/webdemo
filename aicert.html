<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業級 AI 行銷職能認證</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas & jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdfbf7;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 350px;
            max-height: 400px;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Certificate Styling for PDF Capture */
        #certificate-template {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 800px;
            height: 600px;
            background: white;
            padding: 40px;
            border: 20px solid #1e293b;
            text-align: center;
            color: #1e293b;
        }
        .cert-inner {
            border: 2px solid #e2e8f0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Hidden Certificate Template -->
    <div id="certificate-template">
        <div class="cert-inner">
            <h3 style="font-size: 24px; margin-bottom: 10px; color: #64748b; letter-spacing: 4px;">CERTIFICATE OF COMPLETION</h3>
            <h1 style="font-size: 48px; margin-bottom: 20px; font-weight: 900;">企業級 AI 行銷職能認證</h1>
            <p style="font-size: 20px; color: #64748b; margin-bottom: 40px;">謹此證明</p>
            <h2 id="cert-user-name" style="font-size: 42px; margin-bottom: 20px; text-decoration: underline;">使用者姓名</h2>
            <p style="font-size: 18px; line-height: 1.6; max-width: 500px; margin-bottom: 40px;">
                成功通過認證考試，展現了其在 AI 基礎概念、技術核心、系統架構、應用實務及策略倫理等全方位 AI 行銷領域的專業職能。
            </p>
            <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 20px;">
                <div style="text-align: left;">
                    <p style="font-size: 14px; color: #94a3b8;">認證日期：<span id="cert-date">2023-01-01</span></p>
                    <p style="font-size: 14px; color: #94a3b8;">證書編號：<span id="cert-id">AI-2023-XXXX</span></p>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 16px; font-weight: bold;">認證總分：<span id="cert-score">0</span> 分</p>
                    <p style="font-size: 14px; color: #64748b; border-top: 1px solid #1e293b; margin-top: 5px; padding-top: 5px;">認證中心負責人簽署</p>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="flex-grow flex flex-col">
        <!-- 內容將由 JavaScript 動態渲染 -->
    </div>

    <script>
        // --- 內嵌入題庫 (硬編碼於 HTML) ---
        const QUESTION_BANK = [
            // L1: 基礎概念
            { id: 101, level: "L1", question: "在 AI 專案週期中，定義問題 (Problem Definition) 通常發生在哪個階段？", A: "專案啟動前", B: "模型訓練後", C: "資料清理時", D: "部署上線後", ans: "A" },
            { id: 102, level: "L1", question: "下列何者是監督式學習 (Supervised Learning) 的必要條件？", A: "獎勵機制", B: "標註過的資料 (Labeled Data)", C: "生成對抗網絡", D: "未標註的原始數據", ans: "B" },
            { id: 103, level: "L1", question: "機器學習中的『特徵 (Feature)』是指什麼？", A: "模型的價格", B: "數據的輸入屬性", C: "輸出的預測結果", D: "電腦的硬體規格", ans: "B" },
            { id: 104, level: "L1", question: "什麼是『訓練集 (Training Set)』的主要用途？", A: "測試模型最終效能", B: "讓模型學習參數與規律", C: "驗證超參數", D: "儲存使用者資料", ans: "B" },
            { id: 105, level: "L1", question: "人工智慧 (AI)、機器學習 (ML) 與深度學習 (DL) 的包含關係為何？", A: "DL ⊂ ML ⊂ AI", B: "AI ⊂ ML ⊂ DL", C: "ML ⊂ AI ⊂ DL", D: "三者無關", ans: "A" },
            
            // L2: 技術核心
            { id: 201, level: "L2", question: "在類神經網絡中，Activation Function (激活函數) 的主要功能為何？", A: "引入非線性特性", B: "減少計算量", C: "儲存權重", D: "增加資料維度", ans: "A" },
            { id: 202, level: "L2", question: "若模型發生 Overfitting (過擬合)，下列哪種處理方式最合適？", A: "增加模型複雜度", B: "減少訓練資料", C: "使用 Regularization (正規化)", D: "增加學習率", ans: "C" },
            { id: 203, level: "L2", question: "CNN (卷積神經網絡) 最常被應用於哪類任務？", A: "股票預測", B: "圖像識別", C: "語音合成", D: "推薦系統", ans: "B" },
            { id: 204, level: "L2", question: "下列哪個指標最適合評估類別分布不平衡 (Imbalanced) 的分類模型？", A: "Accuracy", B: "F1-Score", C: "MSE", D: "R-Squared", ans: "B" },
            { id: 205, level: "L2", question: "Transformer 架構中的『Self-Attention』機制主要解決了什麼問題？", A: "圖像像素過多", B: "長序列依賴與平行運算", C: "梯度消失", D: "儲存空間不足", ans: "B" },

            // L3: 系統架構
            { id: 301, level: "L3", question: "在 MLOps 中，Model Registry 的主要用途是什麼？", A: "版本化管理模型", B: "監控 GPU 溫度", C: "清洗原始數據", D: "生成前端網頁", ans: "A" },
            { id: 302, level: "L3", question: "RAG (檢索增強生成) 架構通常需要搭配哪種資料庫？", A: "關聯式資料庫", B: "向量資料庫 (Vector DB)", C: "鍵值資料庫", D: "圖形資料庫", ans: "B" },
            { id: 303, level: "L3", question: "資料管線 (Data Pipeline) 中的 ETL 代表什麼？", A: "Extract, Transform, Load", B: "Evaluate, Test, Launch", C: "Edit, Type, Log", D: "Energy, Time, Level", ans: "A" },
            { id: 304, level: "L3", question: "部署模型時，使用 Container (如 Docker) 的主要優勢為何？", A: "提升運算速度", B: "環境一致性與可移植性", C: "自動生成代碼", D: "降低雲端費用", ans: "B" },
            { id: 305, level: "L3", question: "API Gateway 在 AI 微服務架構中的角色為何？", A: "訓練模型", B: "統一入口與流量管理", C: "儲存數據", D: "繪製圖表", ans: "B" },

            // L4: 應用實務
            { id: 401, level: "L4", question: "微調 (Fine-tuning) LLM 時，PEFT 技術的優點是？", A: "需要更多顯卡記憶體", B: "只更新少量參數，降低訓練成本", C: "會降低模型準確度", D: "只能用於圖像模型", ans: "B" },
            { id: 402, level: "L4", question: "在推薦系統中，冷啟動 (Cold Start) 問題是指？", A: "伺服器過熱", B: "新用戶或新商品缺乏歷史數據", C: "模型訓練時間過長", D: "網路延遲過高", ans: "B" },
            { id: 403, level: "L4", question: "使用 Prompt Engineering 優化輸出時，『Chain-of-Thought』是指？", A: "連續提問", B: "引導模型逐步推理出答案", C: "限制回答長度", D: "翻譯成多種語言", ans: "B" },
            { id: 404, level: "L4", question: "在自動化客服中，Intent Classification (意圖分類) 的目的是？", A: "判斷用戶的情緒", B: "識別用戶想要執行的動作", C: "生成隨機回應", D: "記錄通話時間", ans: "B" },
            { id: 405, level: "L4", question: "A/B Testing 在 AI 產品迭代中的作用是？", A: "同時測試兩個模型以比較表現", B: "檢查程式碼錯誤", C: "節省伺服器成本", D: "備份資料庫", ans: "A" },

            // L5: 策略與倫理
            { id: 501, level: "L5", question: "AI 治理 (AI Governance) 中的『可解釋性』為何重要？", A: "為了讓電腦跑得更快", B: "建立信任並符合法規監管需求", C: "減少硬體成本", D: "增加模型複雜度", ans: "B" },
            { id: 502, level: "L5", question: "歐盟 AI 法案 (EU AI Act) 主要採用哪種方式來規範 AI？", A: "全面禁止 AI", B: "基於風險的分級管理", C: "只規範軍事用途", D: "放任市場自由發展", ans: "B" },
            { id: 503, level: "L5", question: "企業導入 AI 轉型時，最常見的失敗原因通常是？", A: "選錯演算法", B: "缺乏明確商業目標與文化變革", C: "電腦不夠快", D: "沒有使用雲端", ans: "B" },
            { id: 504, level: "L5", question: "負責任的 AI (Responsible AI) 強調要消除數據中的什麼？", A: "所有數字", B: "偏見 (Bias) 與歧視", C: "標點符號", D: "重複內容", ans: "B" },
            { id: 505, level: "L5", question: "AI 在未來職場中被視為『賦能』工具，這意味著？", A: "人類將思考能力授權給 AI", B: "協助人類提升效率與創造力", C: "AI 將完全取代人類決策", D: "所有工作都將由 AI 完成", ans: "B" }
        ];

        // --- 應用程式狀態 ---
        let state = {
            view: 'login', // login, home, quiz, result
            userName: '',
            questions: [],
            currentIndex: 0,
            answers: {},
            flags: {},
            timeLeft: 1800,
            timerInterval: null
        };

        const appContainer = document.getElementById('app');

        // --- 流程控制 ---

        function handleLogin(e) {
            e.preventDefault();
            const nameInput = document.getElementById('login-name').value;
            if (nameInput.trim() === '') {
                alert('請輸入姓名');
                return;
            }
            state.userName = nameInput;
            state.view = 'home';
            render();
        }

        function startExam() {
            // 隨機抽題：L1-L5 各抽 2 題
            const selected = [];
            const levels = ['L1', 'L2', 'L3', 'L4', 'L5'];
            
            levels.forEach(lv => {
                const pool = QUESTION_BANK.filter(q => q.level === lv);
                const shuffled = pool.sort(() => Math.random() - 0.5);
                selected.push(...shuffled.slice(0, 2));
            });

            // 如果題庫不足 10 題 (防呆)，隨機補足
            if (selected.length < 10) {
                const remaining = QUESTION_BANK.filter(q => !selected.includes(q));
                const extra = remaining.sort(() => Math.random() - 0.5).slice(0, 10 - selected.length);
                selected.push(...extra);
            }
            
            state.questions = selected.sort(() => Math.random() - 0.5).slice(0, 10);
            state.answers = {};
            state.flags = {};
            state.currentIndex = 0;
            state.timeLeft = 1800;
            state.view = 'quiz';
            
            render();
            startTimer();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                const timerEl = document.getElementById('timer-text');
                if (timerEl) {
                    timerEl.innerText = formatTime(state.timeLeft);
                    if (state.timeLeft < 300) timerEl.classList.add('text-red-500', 'animate-pulse');
                }
                if (state.timeLeft <= 0) submitExam(true);
            }, 1000);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const rs = s % 60;
            return `${m}:${rs.toString().padStart(2, '0')}`;
        }

        function selectAnswer(opt) {
            state.answers[state.currentIndex] = opt;
            render();
        }

        function toggleFlag() {
            state.flags[state.currentIndex] = !state.flags[state.currentIndex];
            render();
        }

        function submitExam(isAuto = false) {
            if (!isAuto && !confirm("確定要提交考卷嗎？")) return;
            clearInterval(state.timerInterval);
            state.view = 'result';
            render();
        }

        function downloadPDF(score) {
            const btn = document.getElementById('download-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '正在生成證書...';
            btn.disabled = true;

            // Update template data
            document.getElementById('cert-user-name').innerText = state.userName;
            document.getElementById('cert-score').innerText = score;
            const now = new Date();
            document.getElementById('cert-date').innerText = now.toISOString().split('T')[0];
            document.getElementById('cert-id').innerText = 'CERT-' + now.getTime().toString().slice(-8).toUpperCase();

            const cert = document.getElementById('certificate-template');
            
            html2canvas(cert, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('landscape', 'px', [800, 600]);
                pdf.addImage(imgData, 'PNG', 0, 0, 800, 600);
                pdf.save(`AI_Certification_${state.userName}.pdf`);
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert('證書生成失敗，請稍後再試。');
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        // --- 渲染函數 ---

        function render() {
            appContainer.innerHTML = '';
            
            if (state.view === 'login') renderLogin();
            else if (state.view === 'home') renderHome();
            else if (state.view === 'quiz') renderQuiz();
            else if (state.view === 'result') renderResult();
        }

        function renderLogin() {
            const html = `
                <div class="flex-grow flex items-center justify-center p-6">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100 fade-in text-center">
                        <div class="text-6xl mb-6">🛡️</div>
                        <h1 class="text-2xl font-black text-slate-800 tracking-tight mb-2">企業級 AI 行銷職能認證</h1>
                        <p class="text-slate-400 text-sm mb-8">考生登入系統</p>
                        <form onsubmit="handleLogin(event)" class="space-y-6 text-left">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">考生姓名</label>
                                <input id="login-name" type="text" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="請輸入您的真實姓名">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">登入密碼</label>
                                <input id="login-pwd" type="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="請輸入密碼">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-all active:scale-95">
                                確認登入
                            </button>
                        </form>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderHome() {
            const html = `
                <div class="flex-grow flex flex-col items-center justify-center p-6">
                    <header class="fixed top-0 w-full bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
                        <div class="font-black text-slate-800 flex items-center gap-2">
                           <span class="text-blue-600">●</span> 企業級 AI 行銷職能認證
                        </div>
                        <div class="text-sm font-bold text-slate-500">考生：${state.userName}</div>
                    </header>
                    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-10 text-center border border-slate-100 fade-in mt-16">
                        <div class="w-20 h-20 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-8 text-indigo-600">
                            <span class="text-4xl">📝</span>
                        </div>
                        <h1 class="text-3xl font-black text-slate-800 mb-4 tracking-tight">你好，${state.userName}</h1>
                        <p class="text-slate-500 mb-10 leading-relaxed text-left px-4 bg-slate-50 py-6 rounded-2xl border border-slate-100">
                            <strong class="text-slate-700 block mb-2 underline decoration-blue-500 decoration-2">認證測驗說明：</strong>
                            • 認證題庫已載入：共 ${QUESTION_BANK.length} 題。<br/>
                            • 隨機抽題機制：L1-L5 各抽 2 題，合計 10 題。<br/>
                            • 通過標準：<span class="font-bold text-blue-600">70 分</span>。<br/>
                            • 考試時間限制：<span class="font-bold text-red-500">30 分鐘</span>。
                        </p>
                        <button onclick="startExam()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-5 rounded-2xl transition-all shadow-xl active:scale-95 text-xl">
                            進入認證考試
                        </button>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderQuiz() {
            const q = state.questions[state.currentIndex];
            const html = `
                <div class="flex flex-col min-h-screen">
                    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-20 shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-widest">${q.level}</span>
                            <div class="hidden md:block text-xs font-bold text-slate-400">認證考試中：${state.userName}</div>
                        </div>
                        <div id="timer-text" class="px-4 py-1 rounded-full font-mono text-xl font-black bg-slate-50 text-slate-700">
                            ${formatTime(state.timeLeft)}
                        </div>
                        <button onclick="toggleFlag()" class="p-2 rounded-lg ${state.flags[state.currentIndex] ? 'bg-orange-100 text-orange-600' : 'text-slate-200'} transition-all">
                            🚩
                        </button>
                    </header>

                    <div class="h-1.5 w-full bg-slate-100">
                        <div class="h-full bg-blue-600 transition-all duration-500" style="width: ${(state.currentIndex + 1) * 10}%"></div>
                    </div>

                    <main class="flex-1 max-w-3xl w-full mx-auto p-6 mt-4">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 md:p-10 mb-8 fade-in">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-snug mb-10">${q.question}</h2>
                            <div class="grid gap-4">
                                ${['A', 'B', 'C', 'D'].map(opt => `
                                    <button onclick="selectAnswer('${opt}')" class="flex items-center gap-4 w-full text-left p-5 rounded-2xl border-2 transition-all ${state.answers[state.currentIndex] === opt ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-50 hover:border-slate-200 bg-slate-50 text-slate-600'}">
                                        <span class="w-8 h-8 rounded-lg flex items-center justify-center font-black ${state.answers[state.currentIndex] === opt ? 'bg-blue-600 text-white' : 'bg-white text-slate-300 border'}">${opt}</span>
                                        ${q[opt]}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="grid grid-cols-5 md:grid-cols-10 gap-2 mb-10">
                            ${state.questions.map((_, i) => `
                                <button onclick="state.currentIndex = ${i}; render();" class="h-10 rounded-xl text-xs font-bold transition-all border-2 relative ${state.currentIndex === i ? 'border-blue-500 ring-2 ring-blue-100' : 'border-transparent'} ${state.answers[i] ? 'bg-emerald-500 text-white' : 'bg-white text-slate-300 border-slate-100'}">
                                    ${i + 1}
                                    ${state.flags[i] ? '<div class="absolute -top-1 -right-1 w-3 h-3 bg-orange-500 rounded-full border-2 border-white"></div>' : ''}
                                </button>
                            `).join('')}
                        </div>

                        ${state.currentIndex === 9 ? `
                            <div class="fade-in mb-8">
                                <button onclick="submitExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 text-xl">
                                    ✅ 確認提交認證考卷
                                </button>
                            </div>
                        ` : ''}
                    </main>

                    <footer class="bg-white border-t p-6 sticky bottom-0 z-20 shadow-lg">
                        <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
                            <button onclick="if(state.currentIndex > 0){state.currentIndex--; render();}" ${state.currentIndex === 0 ? 'disabled' : ''} class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-4 rounded-xl font-black shadow-md disabled:opacity-20 transition-all flex items-center justify-center gap-2 border-b-4 border-indigo-900">
                                ⬅ 上一題
                            </button>
                            <button onclick="if(state.currentIndex < 9){state.currentIndex++; render();}" ${state.currentIndex === 9 ? 'disabled' : ''} class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-4 rounded-xl font-black shadow-md disabled:opacity-20 transition-all flex items-center justify-center gap-2 border-b-4 border-indigo-900">
                                下一題 ➡
                            </button>
                        </div>
                    </footer>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderResult() {
            let score = 0;
            const levelStats = { L1: 0, L2: 0, L3: 0, L4: 0, L5: 0 };
            state.questions.forEach((q, i) => {
                const lv = q.level;
                if (state.answers[i] === q.ans) {
                    score += 10;
                    levelStats[lv]++;
                }
            });

            const isPass = score >= 70;
            const color = isPass ? 'emerald' : 'rose';

            const html = `
                <div class="min-h-screen bg-slate-50 p-6 md:p-10 fade-in">
                    <div class="max-w-4xl mx-auto space-y-8 pb-20">
                        <div class="rounded-[2.5rem] p-10 md:p-12 text-white shadow-2xl relative overflow-hidden bg-${color}-600">
                            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
                                <div>
                                    <h1 class="text-4xl font-black mb-4">認證考生：${state.userName}</h1>
                                    <h2 class="text-5xl font-black mb-2">${isPass ? '認證通過' : '認證未通過'}</h2>
                                    <p class="text-lg opacity-80">通過標準：70 分 | 本次認證得分：${score}</p>
                                </div>
                                <div class="bg-white/20 px-8 py-6 rounded-3xl border border-white/30 backdrop-blur-sm">
                                    <div class="text-[10px] font-black uppercase tracking-widest opacity-60 mb-1">Total Score</div>
                                    <div class="text-6xl font-black">${score}</div>
                                </div>
                            </div>
                        </div>

                        ${isPass ? `
                        <div class="fade-in">
                            <button id="download-btn" onclick="downloadPDF(${score})" class="w-full bg-white text-emerald-600 border-2 border-emerald-600 hover:bg-emerald-50 font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 text-xl">
                                📄 下載電子認證證書 (PDF)
                            </button>
                        </div>
                        ` : ''}

                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-800 mb-6 tracking-tight">📊 認證職能分佈雷達圖</h3>
                                <div class="chart-container">
                                    <canvas id="radarCanvas"></canvas>
                                </div>
                            </div>

                            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 space-y-6">
                                <h3 class="text-xl font-bold text-slate-800 mb-2">認證維度統計</h3>
                                <div class="space-y-5">
                                    ${Object.entries(levelStats).map(([lv, count]) => `
                                        <div class="space-y-1">
                                            <div class="flex justify-between text-[10px] font-black text-slate-400 tracking-widest uppercase">
                                                <span>${lv} 級別</span>
                                                <span class="text-slate-700">${count}/2 正確</span>
                                            </div>
                                            <div class="h-2.5 bg-slate-50 rounded-full overflow-hidden p-0.5 shadow-inner border border-slate-100">
                                                <div class="h-full rounded-full ${count === 2 ? 'bg-emerald-500' : count === 1 ? 'bg-indigo-500' : 'bg-rose-400'}" style="width: ${(count / 2) * 100}%"></div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="pt-6 border-t border-slate-50 text-sm text-slate-400 font-medium italic">
                                    認證分析：您在 ${Object.entries(levelStats).sort((a,b)=>a[1]-b[1])[0][0]} 階段仍有進步空間。
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                            <h3 class="text-xl font-bold text-slate-800 mb-6">認證題目詳細解析</h3>
                            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                ${state.questions.map((q, i) => `
                                    <div class="p-4 rounded-2xl border-2 flex flex-col items-center gap-1 ${state.answers[i] === q.ans ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-rose-50 border-rose-100 text-rose-600'}">
                                        <span class="text-[10px] font-black opacity-40 uppercase">Q${i+1}</span>
                                        <span class="text-xl font-black">${state.answers[i] === q.ans ? '✓' : '✗'}</span>
                                        <span class="text-[10px] font-bold opacity-70">正確答案: ${q.ans}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;

            const ctx = document.getElementById('radarCanvas').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['L1 基礎', 'L2 核心', 'L3 架構', 'L4 應用', 'L5 策略'],
                    datasets: [{
                        label: '得分率 %',
                        data: ['L1', 'L2', 'L3', 'L4', 'L5'].map(lv => (levelStats[lv] / 2) * 100),
                        backgroundColor: 'rgba(79, 70, 229, 0.2)',
                        borderColor: 'rgba(79, 70, 229, 1)',
                        borderWidth: 3,
                        pointBackgroundColor: 'rgba(79, 70, 229, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 100,
                            ticks: { stepSize: 25, display: false },
                            grid: { color: '#f1f5f9' },
                            pointLabels: { font: { size: 12, weight: '900' }, color: '#64748b' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 初始渲染
        render();

    </script>
</body>
</html>
