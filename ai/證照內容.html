<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>證照內容 | 企業級 AI 行銷職能認證</title>
    <style>
        :root { --primary-color: #0056b3; --hover-color: #004494; --text-color: #333; }
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; color: var(--text-color); background-color: #fff; padding-top: 80px; margin: 0; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .breadcrumb { margin-bottom: 30px; color: #666; font-size: 14px; }
        .breadcrumb a:hover { color: var(--primary-color); text-decoration: underline; }
        .page-title-section { text-align: center; margin-bottom: 50px; }
        .page-title-section h1 { font-size: 36px; color: var(--primary-color); margin-bottom: 15px; }
        
        .strengths-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-bottom: 60px; }
        .strength-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 40px; display: flex; align-items: flex-start; transition: transform 0.3s, box-shadow 0.3s; }
        .strength-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-color: var(--primary-color); }
        .strength-icon { font-size: 48px; color: var(--primary-color); margin-right: 25px; flex-shrink: 0; }
        .strength-content h3 { font-size: 22px; margin-bottom: 15px; color: #333; }
        .strength-content p { font-size: 16px; color: #666; line-height: 1.8; text-align: justify; }

        .cta-section { background-color: #f4faff; padding: 50px; text-align: center; border-radius: 10px; }
        .cta-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .cta-btn { display: inline-block; padding: 12px 30px; font-size: 16px; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .cta-btn-primary { background-color: var(--primary-color); color: #fff; }
        .cta-btn-secondary { background-color: #fff; color: var(--primary-color); border: 2px solid var(--primary-color); }
        @media (max-width: 768px) { .strengths-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <div class="breadcrumb"><a href="首頁.html">首頁</a> &gt; <span>證照內容</span> &gt; <span>認證優勢</span></div>
        <div class="page-title-section">
            <h1>認證優勢與特色</h1>
            <p>為什麼選擇企業級 AI 行銷職能認證？</p>
        </div>
        <div class="strengths-grid">
            <div class="strength-card"><div class="strength-icon">⚖️</div><div class="strength-content"><h3>公正客觀</h3><p>由「財團法人勞動基金會」主辦，採行嚴謹的試務流程與第三方監考制度。</p></div></div>
            <div class="strength-card"><div class="strength-icon">🎓</div><div class="strength-content"><h3>專業命題</h3><p>匯集 AI 領域權威學者與業界資深經理人共同組成命題委員會。</p></div></div>
            <div class="strength-card"><div class="strength-icon">🛠️</div><div class="strength-content"><h3>實務導向</h3><p>強調「做中學、學中做」，包含情境模擬與工具操作題型。</p></div></div>
            <div class="strength-card"><div class="strength-icon">🚀</div><div class="strength-content"><h3>職涯發展</h3><p>獲多家知名企業列為優先面試參考指標。</p></div></div>
        </div>
        <div class="cta-section">
            <h2>準備好證明您的 AI 行銷實力了嗎？</h2>
            <div class="cta-buttons">
                <a href="證照樣張.html" class="cta-btn cta-btn-secondary">查看證照樣張</a>
                <a href="首頁.html?view=exam-list" class="cta-btn cta-btn-primary">瀏覽所有考試</a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script>
        function loadComponent(url, elementId) { fetch(url).then(r => r.text()).then(d => document.getElementById(elementId).innerHTML = d); }
        window.addEventListener('load', function() { loadComponent('頁首.html', 'header-placeholder'); loadComponent('頁尾.html', 'footer-placeholder'); });
    </script>
</body>
</html>
