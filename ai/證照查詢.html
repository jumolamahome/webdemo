<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>證照查詢 | 企業級 AI 行銷職能認證</title>
    <style>
        :root { --primary-color: #0056b3; --hover-color: #004494; --text-color: #333; --success-color: #28a745; --error-color: #dc3545; --warning-color: #ffc107; }
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; color: var(--text-color); background-color: #fff; padding-top: 80px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .breadcrumb { margin-bottom: 30px; color: #666; font-size: 14px; }
        .breadcrumb a:hover { color: var(--primary-color); text-decoration: underline; }
        .page-title-section { text-align: center; margin-bottom: 40px; }
        .page-title-section h1 { font-size: 36px; color: var(--primary-color); margin-bottom: 10px; }
        
        .box-container { max-width: 700px; margin: 0 auto 60px auto; background-color: #f4faff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 50px; border: 1px solid #e1e8ed; }
        .form-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e1e8ed; padding-bottom: 20px; }
        .form-header h2 { font-size: 24px; color: #333; margin-bottom: 10px; }
        .verify-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group label { font-weight: bold; color: #444; margin-bottom: 8px; display: block; }
        .form-control { width: 100%; padding: 12px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        .submit-btn { margin-top: 20px; padding: 15px; background-color: var(--primary-color); color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .note-section { margin-top: 30px; padding: 20px; background-color: #fff8e1; border-radius: 6px; font-size: 14px; color: #856404; }
        
        #result-box { display: none; }
        .result-header { text-align: center; margin-bottom: 30px; }
        .result-icon { font-size: 60px; margin-bottom: 15px; display: inline-block; }
        .result-title { font-size: 26px; font-weight: bold; margin-bottom: 10px; }
        .result-details { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px; }
        .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; }
        .action-buttons { display: flex; gap: 15px; }
        .btn-outline { flex: 1; padding: 12px; border: 2px solid var(--primary-color); background: #fff; color: var(--primary-color); border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-download { flex: 1; padding: 12px; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        
        .status-success .result-icon, .status-success .result-title { color: var(--success-color); }
        .status-success .btn-download { background-color: var(--success-color); }
        .status-error .result-icon, .status-error .result-title { color: var(--error-color); }
        .status-error .btn-download { background-color: #ccc; cursor: not-allowed; pointer-events: none; }
        .status-warning .result-icon, .status-warning .result-title { color: var(--warning-color); }
        .status-warning .btn-download { background-color: #ccc; cursor: not-allowed; pointer-events: none; }
        @media (max-width: 768px) { .box-container { padding: 30px 20px; } }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <div class="breadcrumb"><a href="首頁.html">首頁</a> &gt; <a href="證照內容.html">證照內容</a> &gt; <span>證照查詢</span></div>
        <div class="page-title-section"><h1>證書查驗系統</h1><p>請輸入證書相關資訊以確認證書有效性</p></div>

        <div id="query-box" class="box-container">
            <div class="form-header"><h2>輸入驗證資訊</h2><p>請確保輸入的資料與證書上完全一致</p></div>
            <form class="verify-form" id="verifyForm">
                <div class="form-group"><label for="issue-date">發證日期</label><input type="text" id="issue-date" class="form-control" placeholder="YYYY-MM-DD" required></div>
                <div class="form-group"><label for="id-number">身分證字號</label><input type="text" id="id-number" class="form-control" placeholder="請輸入身分證字號" required></div>
                <div class="form-group"><label for="cert-number">證書號碼</label><input type="text" id="cert-number" class="form-control" placeholder="請輸入證書編號" required></div>
                <button type="submit" class="submit-btn">立即驗證</button>
            </form>
            <div class="note-section"><strong>💡 查詢說明：</strong>輸入資料若含 <code>?</code> 將觸發測試狀態。</div>
        </div>

        <div id="result-box" class="box-container">
            <div class="result-header"><div class="result-icon" id="res-icon">✔</div><div class="result-title" id="res-title">查驗結果</div><p id="res-subtitle" style="color: #666;"></p></div>
            <div class="result-details">
                <div class="detail-row"><span class="detail-label">姓名</span><span class="detail-value">Wang Xiao-Ming</span></div>
                <div class="detail-row"><span class="detail-label">身分證字號</span><span class="detail-value" id="res-id"></span></div>
                <div class="detail-row"><span class="detail-label">證照名稱</span><span class="detail-value" style="color: var(--primary-color);">AI 初級基礎認證 - 基礎規劃師</span></div>
                <div class="detail-row"><span class="detail-label">證書編號</span><span class="detail-value" id="res-cert-no"></span></div>
                <div class="detail-row"><span class="detail-label">發證日期</span><span class="detail-value" id="res-date"></span></div>
            </div>
            <div class="action-buttons"><button class="btn-outline" onclick="resetForm()">重新查詢</button><button class="btn-download" id="btn-download">下載電子證書 (PDF)</button></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const issueDate = document.getElementById('issue-date').value.trim();
            const idNumber = document.getElementById('id-number').value.trim();
            const certNumber = document.getElementById('cert-number').value.trim();
            const resultBox = document.getElementById('result-box');
            const resIcon = document.getElementById('res-icon');
            const resTitle = document.getElementById('res-title');
            const resSubtitle = document.getElementById('res-subtitle');
            
            resultBox.classList.remove('status-success', 'status-error', 'status-warning');

            if (idNumber.includes('?')) {
                resultBox.classList.add('status-error'); resIcon.innerHTML = '✘'; resTitle.innerText = '查驗結果：無效 / 查無此證書'; resSubtitle.innerText = 'Certificate Not Found';
                document.getElementById('btn-download').innerText = '無法下載';
            } else if (issueDate.includes('?')) {
                resultBox.classList.add('status-warning'); resIcon.innerHTML = '⚠'; resTitle.innerText = '查驗結果：認證已過期'; resSubtitle.innerText = 'Certificate Expired';
                document.getElementById('btn-download').innerText = '已失效';
            } else {
                resultBox.classList.add('status-success'); resIcon.innerHTML = '✔'; resTitle.innerText = '查驗結果：有效證書'; resSubtitle.innerText = 'Verification Successful';
                document.getElementById('btn-download').innerText = '下載電子證書 (PDF)';
            }

            document.getElementById('res-date').innerText = issueDate;
            document.getElementById('res-cert-no').innerText = certNumber;
            document.getElementById('res-id').innerText = (!idNumber.includes('?') && idNumber.length > 3) ? idNumber.substring(0, 2) + "*****" + idNumber.substring(idNumber.length - 1) : idNumber;

            document.getElementById('query-box').style.display = 'none';
            resultBox.style.display = 'block';
        });

        function resetForm() {
            document.getElementById('verifyForm').reset();
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('query-box').style.display = 'block';
        }

        function loadComponent(url, elementId) { fetch(url).then(r => r.text()).then(d => document.getElementById(elementId).innerHTML = d); }
        window.addEventListener('load', function() { loadComponent('頁首.html', 'header-placeholder'); loadComponent('頁尾.html', 'footer-placeholder'); });
    </script>
</body>
</html>
