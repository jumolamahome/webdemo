</style></head><body><main class="wrap"><header class="hero"><h1>TOEIC 閱讀模擬測驗｜50 題</h1><div class="muted">原創仿真練習・目標約 550 分・Part 5–7・繁體中文解析</div><p>建議作答時間 38 分鐘。單選題，每題 2 分，滿分 100 分。此成績為練習分數，並非官方多益換算分數。</p></header><div class="stats"><div class="stat">已作答<b id="answered">0 / 50</b></div><div class="stat">剩餘時間<b id="timer">38:00</b></div><div class="stat">目前區段<b id="partnow">Part 5</b></div></div><div class="toolbar"><button onclick="jump('Part 5')">Part 5</button><button onclick="jump('Part 6')">Part 6</button><button onclick="jump('Part 7')">Part 7</button><button onclick="toggleTimer()" id="pause">暫停計時</button><button class="primary" onclick="grade()">交卷並計分</button><button class="danger" onclick="resetExam()">重新作答</button></div><div id="result" class="result"></div><div id="questions"></div><div class="toolbar"><button class="primary" onclick="grade()">交卷並顯示答案與解析</button><button onclick="window.print()">列印／另存 PDF</button></div><p class="small">本題庫為原創練習題，非 ETS 官方考古題。Part 6 採短文搭配單題方式呈現，與正式多益的段落填空排版不完全相同。</p></main><script>const qs=[{"part": "Part 5", "stem": "All employees must submit ___ expense reports by Friday.", "opts": ["they", "their", "them", "theirs"], "ans": 1, "exp": "名詞 expense reports 前須使用所有格形容詞 their。", "passage": null}, {"part": "Part 5", "stem": "The new printer is ___ than the previous model.", "opts": ["efficient", "more efficient", "most efficient", "efficiency"], "ans": 1, "exp": "than 表示比較級，使用 more efficient。", "passage": null}, {"part": "Part 5", "stem": "Please contact Ms. Chen if you have ___ questions about the schedule.", "opts": ["any", "much", "every", "each"], "ans": 0, "exp": "複數名詞 questions 搭配 any，表示任何問題。", "passage": null}, {"part": "Part 5", "stem": "The manager will ___ the proposal at tomorrow’s meeting.", "opts": ["discussion", "discuss", "discussed", "discussing"], "ans": 1, "exp": "will 後面接原形動詞 discuss。", "passage": null}, {"part": "Part 5", "stem": "Our office is located ___ the third floor.", "opts": ["at", "on", "in", "by"], "ans": 1, "exp": "樓層使用介系詞 on。", "passage": null}, {"part": "Part 5", "stem": "The shipment was delayed ___ heavy rain.", "opts": ["because", "due to", "although", "despite of"], "ans": 1, "exp": "due to 後接名詞片語 heavy rain，表示因為。", "passage": null}, {"part": "Part 5", "stem": "Customers who register online will receive a ___ email.", "opts": ["confirm", "confirmation", "confirmed", "confirming"], "ans": 1, "exp": "名詞 email 前使用 confirmation 作名詞修飾語，表示確認信。", "passage": null}, {"part": "Part 5", "stem": "The training session begins ___ 9:30 a.m.", "opts": ["in", "on", "at", "for"], "ans": 2, "exp": "具體時刻使用 at。", "passage": null}, {"part": "Part 5", "stem": "We have worked with this supplier ___ 2021.", "opts": ["for", "since", "during", "until"], "ans": 1, "exp": "現在完成式搭配 since 加起始年份。", "passage": null}, {"part": "Part 5", "stem": "The marketing team is responsible ___ updating the website.", "opts": ["to", "with", "for", "about"], "ans": 2, "exp": "固定搭配 be responsible for。", "passage": null}, {"part": "Part 5", "stem": "The report should be completed ___ the end of the month.", "opts": ["by", "between", "among", "across"], "ans": 0, "exp": "by 表示不晚於指定期限。", "passage": null}, {"part": "Part 5", "stem": "Mr. Lin speaks English ___ during client presentations.", "opts": ["clear", "clearly", "clarity", "clearing"], "ans": 1, "exp": "修飾動詞 speaks 需用副詞 clearly。", "passage": null}, {"part": "Part 5", "stem": "The company plans to ___ a new branch in Kaohsiung.", "opts": ["open", "opening", "opened", "opens"], "ans": 0, "exp": "plans to 後接原形動詞 open。", "passage": null}, {"part": "Part 5", "stem": "The conference room is not ___ for the afternoon.", "opts": ["availability", "available", "availably", "avail"], "ans": 1, "exp": "be 動詞後需形容詞 available。", "passage": null}, {"part": "Part 5", "stem": "Please review the contract carefully before ___ it.", "opts": ["sign", "signed", "signing", "signs"], "ans": 2, "exp": "介系詞 before 後接動名詞 signing。", "passage": null}, {"part": "Part 5", "stem": ": "The files are stored ___ on the company server.", "opts": ["secure", "security", "securely", "securing"], "ans": 2, "exp": "修飾 stored 需副詞 securely。", "passage": null}, {"part": "Part 5", "stem": "The restaurant offers discounts to customers ___ book in advance.", "opts": ["which", "who", "whose", "whom"], "ans": 1, "exp": "關係代名詞 who 指人並作子句主詞。", "passage": null}, {"part": "Part 5", "stem": "The instructions were ___ enough for new users to follow.", "opts": ["simple", "simply", "simplify", "simplicity"], "ans": 0, "exp": "were 後接形容詞 simple，enough 修飾形容詞。", "passage": null}, {"part": "Part 5", "stem": "Please let us know ___ you need additional assistance.", "opts": ["whether", "unless", "despite", "during"], "ans": 0, "exp": "whether 引導名詞子句，表示是否需要協助。", "passage": null}, {"part": "Part 5", "stem": "The director requested that the documents ___ sent immediately.", "opts": ["are", "were", "be", "being"], "ans": 2, "exp": "request that 後可用原形動詞 be，屬要求語氣。", "passage": null}, {"part": "Part 6", "stem": "The inspection will take place ___ Saturday.", "opts": ["at", "on", "in", "by"], "ans": 1, "exp": "日期與星期前用 on。", "passage": "To: All Staff\nSubject: Office Maintenance\n\nThe air-conditioning system will be inspected on Saturday, November 14. Technicians will arrive at 8:00 a.m. and expect to finish by noon. Employees should remove personal items from desks near the windows. The office will be closed during the inspection. If you need to collect anything, please do so by Friday evening. Thank you for your cooperation.\n\nFacilities Team"}, {"part": "Part 6", "stem": "Technicians ___ to finish by noon.", "opts": ["expect", "expects", "expecting", "expected"], "ans": 0, "exp": "主詞 Technicians 為複數，使用 expect。", "passage": "To: All Staff\nSubject: Office Maintenance\n\nThe air-conditioning system will be inspected on Saturday, November 14. Technicians will arrive at 8:00 a.m. and expect to finish by noon. Employees should remove personal items from desks near the windows. The office will be closed during the inspection. If you need to collect anything, please do so by Friday evening. Thank you for your cooperation.\n\nFacilities Team"}, {"part": "Part 6", "stem": "Employees should remove ___ personal items.", "opts": ["they", "them", "their", "theirs"], "ans": 2, "exp": "名詞 personal items 前使用 their。", "passage": "To: All Staff\nSubject: Office Maintenance\n\nThe air-conditioning system will be inspected on Saturday, November 14. Technicians will arrive at 8:00 a.m. and expect to finish by noon. Employees should remove personal items from desks near the windows. The office will be closed during the inspection. If you need to collect anything, please do so by Friday evening. Thank you for your cooperation.\n\nFacilities Team"}, {"part": "Part 6", "stem": "Thank you for your ___.", "opts": ["cooperate", "cooperative", "cooperation", "cooperatively"], "ans": 2, "exp": "介系詞 for 後接名詞 cooperation。", "passage": "To: All Staff\nSubject: Office Maintenance\n\nThe air-conditioning system will be inspected on Saturday, November 14. Technicians will arrive at 8:00 a.m. and expect to finish by noon. Employees should remove personal items from desks near the windows. The office will be closed during the inspection. If you need to collect anything, please do so by Friday evening. Thank you for your cooperation.\n\nFacilities Team"}, {"part": "Part 6", "stem": "The new procedure will begin ___ December 1.", "opts": ["at", "on", "in", "since"], "ans": 1, "exp": "特定日期前使用 on。", "passage": "Subject: Updated Delivery Procedure\n\nStarting December 1, all orders will be checked twice before shipping. This change is intended to reduce packing errors. Warehouse staff must compare the packing list with the items in each box. If an item is missing, they should inform the supervisor immediately. Customers will receive a tracking number once their orders leave the warehouse. We appreciate your patience as we introduce this process.\n\nOperations Department"}, {"part": "Part 6", "stem": "The purpose of the change is to ___ errors.", "opts": ["reduce", "reduction", "reduced", "reducing"], "ans": 0, "exp": "to 後接原形動詞 reduce。", "passage": "Subject: Updated Delivery Procedure\n\nStarting December 1, all orders will be checked twice before shipping. This change is intended to reduce packing errors. Warehouse staff must compare the packing list with the items in each box. If an item is missing, they should inform the supervisor immediately. Customers will receive a tracking number once their orders leave the warehouse. We appreciate your patience as we introduce this process.\n\nOperations Department"}, {"part": "Part 6", "stem": "Staff should report missing items ___.", "opts": ["immediate", "immediately", "immediacy", "more immediate"], "ans": 1, "exp": "修飾 report 需副詞 immediately。", "passage": "Subject: Updated Delivery Procedure\n\nStarting December 1, all orders will be checked twice before shipping. This change is intended to reduce packing errors. Warehouse staff must compare the packing list with the items in each box. If an item is missing, they should inform the supervisor immediately. Customers will receive a tracking number once their orders leave the warehouse. We appreciate your patience as we introduce this process.\n\nOperations Department"}, {"part": "Part 6", "stem": "Customers will receive a tracking number ___ the order leaves the warehouse.", "opts": ["once", "despite", "unless", "because of"], "ans": 0, "exp": "once 可引導時間子句，表示一旦出貨。", "passage": "Subject: Updated Delivery Procedure\n\nStarting December 1, all orders will be checked twice before shipping. This change is intended to reduce packing errors. Warehouse staff must compare the packing list with the items in each box. If an item is missing, they should inform the supervisor immediately. Customers will receive a tracking number once their orders leave the warehouse. We appreciate your patience as we introduce this process.\n\nOperations Department"}, {"part": "Part 7", "stem": "What is the announcement mainly about?", "opts": ["A store relocation", "A weekend promotion", "A new membership fee", "A book signing"], "ans": 1, "exp": "公告列出週末特賣與折扣。", "passage": "RIVER CITY BOOKSTORE\nWeekend Sale — November 21–22\nAll travel books: 20% off\nAll notebooks: Buy two, get one free\nStore hours: Saturday 10 a.m.–8 p.m.; Sunday 11 a.m.–6 p.m.\nMembers receive an additional 5% discount on travel books. Discounts cannot be combined with other coupons.\nAddress: 18 Park Road"}, {"part": "Part 7", "stem": "When does the store open on Sunday?", "opts": ["8 a.m.", "10 a.m.", "11 a.m.", "Noon"], "ans": 2, "exp": "公告寫明 Sunday 11 a.m.–6 p.m.。", "passage": "RIVER CITY BOOKSTORE\nWeekend Sale — November 21–22\nAll travel books: 20% off\nAll notebooks: Buy two, get one free\nStore hours: Saturday 10 a.m.–8 p.m.; Sunday 11 a.m.–6 p.m.\nMembers receive an additional 5% discount on travel books. Discounts cannot be combined with other coupons.\nAddress: 18 Park Road"}, {"part": "Part 7", "stem": "Which item has a buy-two-get-one-free offer?", "opts": ["Travel books", "Notebooks", "Magazines", "Calendars"], "ans": 1, "exp": "筆記本有買二送一優惠。", "passage": "RIVER CITY BOOKSTORE\nWeekend Sale — November 21–22\nAll travel books: 20% off\nAll notebooks: Buy two, get one free\nStore hours: Saturday 10 a.m.–8 p.m.; Sunday 11 a.m.–6 p.m.\nMembers receive an additional 5% discount on travel books. Discounts cannot be combined with other coupons.\nAddress: 18 Park Road"}, {"part": "Part 7", "stem": "What is stated about coupons?", "opts": ["They are valid only Sunday.", "They can be combined with all discounts.", "They cannot be combined with the sale discounts.", "They are required for members."], "ans": 2, "exp": "公告明確指出折扣不可與其他優惠券合併。", "passage": "RIVER CITY BOOKSTORE\nWeekend Sale — November 21–22\nAll travel books: 20% off\nAll notebooks: Buy two, get one free\nStore hours: Saturday 10 a.m.–8 p.m.; Sunday 11 a.m.–6 p.m.\nMembers receive an additional 5% discount on travel books. Discounts cannot be combined with other coupons.\nAddress: 18 Park Road"}, {"part": "Part 7", "stem": "Why does Maya want to change the meeting time?", "opts": ["She is traveling.", "She has a client call.", "The room is being repaired.", "Daniel is unavailable."], "ans": 1, "exp": "Maya 表示週二下午必須參加客戶電話會議。", "passage": "Email\nFrom: Maya Wu\nTo: Daniel Lee\nSubject: Project Review Meeting\n\nHi Daniel,\nCould we move our project review meeting from Tuesday at 2 p.m. to Wednesday at 10 a.m.? I need to attend a client call on Tuesday afternoon. I have already reserved Meeting Room B for Wednesday. Please send me the updated sales figures before the meeting so I can include them in the presentation.\nThanks,\nMaya"}, {"part": "Part 7", "stem": "When is the proposed new meeting time?", "opts": ["Tuesday at 10 a.m.", "Tuesday at 2 p.m.", "Wednesday at 10 a.m.", "Wednesday at 2 p.m."], "ans": 2, "exp": "信中提議改至週三上午 10 點。", "passage": "Email\nFrom: Maya Wu\nTo: Daniel Lee\nSubject: Project Review Meeting\n\nHi Daniel,\nCould we move our project review meeting from Tuesday at 2 p.m. to Wednesday at 10 a.m.? I need to attend a client call on Tuesday afternoon. I have already reserved Meeting Room B for Wednesday. Please send me the updated sales figures before the meeting so I can include them in the presentation.\nThanks,\nMaya"}, {"part": "Part 7", "stem": "What has Maya already done?", "opts": ["Sent the sales figures", "Finished the presentation", "Reserved Meeting Room B", "Canceled the client call"], "ans": 2, "exp": "她已預訂週三的 B 會議室。", "passage": "Email\nFrom: Maya Wu\nTo: Daniel Lee\nSubject: Project Review Meeting\n\nHi Daniel,\nCould we move our project review meeting from Tuesday at 2 p.m. to Wednesday at 10 a.m.? I need to attend a client call on Tuesday afternoon. I have already reserved Meeting Room B for Wednesday. Please send me the updated sales figures before the meeting so I can include them in the presentation.\nThanks,\nMaya"}, {"part": "Part 7", "stem": "What does Maya ask Daniel to send?", "opts": ["A customer list", "Updated sales figures", "Travel documents", "A room reservation"], "ans": 1, "exp": "信中要求會前寄送更新後的銷售數據。", "passage": "Email\nFrom: Maya Wu\nTo: Daniel Lee\nSubject: Project Review Meeting\n\nHi Daniel,\nCould we move our project review meeting from Tuesday at 2 p.m. to Wednesday at 10 a.m.? I need to attend a client call on Tuesday afternoon. I have already reserved Meeting Room B for Wednesday. Please send me the updated sales figures before the meeting so I can include them in the presentation.\nThanks,\nMaya"}, {"part": "Part 7", "stem": "On which day is the museum closed?", "opts": ["Monday", "Tuesday", "Saturday", "Sunday"], "ans": 0, "exp": "公告寫明週一休館。", "passage": "City Museum Visitor Information\nThe City Museum is open Tuesday through Sunday, 9 a.m. to 5 p.m., and is closed on Mondays. Admission is NT$200 for adults and NT$100 for students with a valid ID. Guided tours begin at 10 a.m. and 2 p.m. daily and are included in the ticket price. Visitors may take photographs without flash, but food and drinks are not allowed inside the exhibition rooms. Tickets can be purchased online or at the entrance."}, {"part": "Part 7", "stem": "How much does a student with valid ID pay?", "opts": ["NT$50", "NT$100", "NT$150", "NT$200"], "ans": 1, "exp": "持有效學生證票價為新臺幣 100 元。", "passage": "City Museum Visitor Information\nThe City Museum is open Tuesday through Sunday, 9 a.m. to 5 p.m., and is closed on Mondays. Admission is NT$200 for adults and NT$100 for students with a valid ID. Guided tours begin at 10 a.m. and 2 p.m. daily and are included in the ticket price. Visitors may take photographs without flash, but food and drinks are not allowed inside the exhibition rooms. Tickets can be purchased online or at the entrance."}, {"part": "Part 7", "stem": "What is included in the admission price?", "opts": ["A meal", "A souvenir", "A guided tour", "A parking pass"], "ans": 2, "exp": "導覽已包含在 (o,j)=>{let lab=document.createElement('label');lab.className='option';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.addEventListener('change',()=>{answers[i]=j;document.getElementById('answered').textContent=answers.filter(v=>v!==null).length+' / 50';document.getElementById('partnow').textContent=q.part});lab.append(input,document.createTextNode(letters[j]+'. '+o));opts.append(lab)});div.append(opts);let ex=document.createElement('div');ex.className='explain';ex.id='e'+i;div.append(ex);el.append(div)});function jump(p){document.getElementById(p.replace(' ','')).scrollIntoView({behavior:'smooth'})}function grade(){if(submitted)return;let n=answers.filter(v=>v!==null).length;if(n<50&&!confirm('還有 '+(50-n)+' 題未作答，確定交卷？'))return;submitted=true;paused=true;let good=0;let section={};qs.forEach((q,i)=>{let ok=answers[i]===q.ans;if(ok)good++;if(!section[q.part])section[q.part]=[0,0];section[q.part][1]++;if(ok)section[q.part][0]++;let ex=document.getElementById('e'+i);ex.style.display='block';if(!ok)ex.classList.add('wrong');ex.innerHTML='<strong class="'+(ok?'correct':'incorrect')+'">'+(ok?'答對':'答錯或未作答')+'</strong>｜正確答案：'+letters[q.ans]+'. '+escapeHtml(q.opts[q.ans])+'<br>'+escapeHtml(q.exp);document.querySelectorAll('input[name=q'+i+']').forEach(x=>x.disabled=true)});let r=document.getElementById('result');r.style.display='block';r.innerHTML='<h2>測驗結果：'+good*2+' / 100 分</h2><p>答對 '+good+' / 50 題，正確率 '+(good*2)+'%。</p>'+Object.entries(section).map(([k,v])=>'<p>'+k+'：'+v[0]+' / '+v[1]+' 題</p>').join('')+'<p>下方已顯示每題標準答案與繁體中文解析。此分數不能直接換算 TOEIC 官方分數。</p>';r.scrollIntoView({behavior:'smooth'})}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function resetExam(){if(confirm('確定清除答案並重新開始？'))location.reload()}function toggleTimer(){paused=!paused;document.getElementById('pause').textContent=paused?'繼續計時':'暫停計時'}setInterval(()=>{if(paused||submitted)return;if(
