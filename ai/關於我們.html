<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 | 企業級 AI 行銷職能認證</title>
    <style>
        :root { --primary-color: #0056b3; --btn-color: #f0ad4e; --btn-hover: #ec971f; --text-color: #333; }
        body { font-family: "Microsoft JhengHei", sans-serif; line-height: 1.6; color: var(--text-color); background-color: #fff; padding-top: 80px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .about-banner { background: #0056b3; color: #fff; text-align: center; padding: 100px 20px; margin-bottom: 60px; }
        .about-banner h1 { font-size: 42px; margin-bottom: 20px; }
        .intro-section { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; margin-bottom: 80px; }
        .intro-image img { width: 100%; border-radius: 10px; background: #ddd; min-height: 300px; }
        .intro-text h2 { font-size: 32px; color: var(--primary-color); border-left: 5px solid var(--primary-color); padding-left: 15px; }
        
        .team-section { background-color: #f9f9f9; padding: 80px 0; margin-bottom: 80px; }
        .section-title { text-align: center; font-size: 32px; color: #333; margin-bottom: 50px; }
        .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .team-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .member-photo { height: 200px; background-color: #ddd; display: flex; align-items: center; justify-content: center; }
        .member-info { padding: 20px; }
        .contact-container { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; background: #fff; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
        .contact-info { background-color: var(--primary-color); color: #fff; padding: 50px; }
        .contact-form-wrapper { padding: 50px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px; }
        .submit-btn { background-color: var(--btn-color); color: #fff; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .legal-section { background-color: #333; color: #ccc; padding: 40px 0; text-align: center; }
        .legal-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        @media (max-width: 768px) { .intro-section, .contact-container, .team-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="about-banner"><div class="container"><h1>關於勞動基金會 × 中華網路行銷講師協會</h1><p>攜手推動 AI 行銷職能標準化</p></div></section>

    <div class="container">
        <section class="intro-section">
            <div class="intro-text"><h2>組織介紹</h2><p><strong>財團法人勞動基金會</strong> 與 <strong>中華網路行銷講師協會</strong> 強強聯手，共同開發「企業級 AI 行銷職能認證」。</p></div>
            <div class="intro-image"><div style="width:100%;height:300px;background:#ddd;display:flex;align-items:center;justify-content:center;">組織合照</div></div>
        </section>
    </div>

    <section class="team-section">
        <div class="container"><h2 class="section-title">顧問委員團隊</h2><div class="team-grid"><div class="team-card"><div class="member-photo">Photo</div><div class="member-info"><div class="member-name">張教授</div><div class="member-title">召集人</div></div></div><div class="team-card"><div class="member-photo">Photo</div><div class="member-info"><div class="member-name">李執行長</div><div class="member-title">顧問</div></div></div><div class="team-card"><div class="member-photo">Photo</div><div class="member-info"><div class="member-name">王理事長</div><div class="member-title">講師協會</div></div></div><div class="team-card"><div class="member-photo">Photo</div><div class="member-info"><div class="member-name">陳總監</div><div class="member-title">廣告代理</div></div></div></div></div>
    </section>

    <div class="container">
        <section class="contact-section">
            <h2 class="section-title">聯絡我們</h2>
            <div class="contact-container">
                <div class="contact-info"><h3>聯絡資訊</h3><p>📞 02-1234-5678</p><p>✉️ service@aiexam.org.tw</p></div>
                <div class="contact-form-wrapper"><form><input type="text" class="form-control" placeholder="姓名"><input type="email" class="form-control" placeholder="Email"><textarea class="form-control" rows="4" placeholder="留言"></textarea><button type="button" class="submit-btn" onclick="alert('已送出')">送出留言</button></form></div>
            </div>
        </section>
    </div>

    <section class="legal-section">
        <div class="container"><div class="legal-links"><a href="#">使用條款</a><a href="#">隱私權政策</a></div><p>本網站內容著作權屬於財團法人勞動基金會所有。</p></div>
    </section>

    <div id="footer-placeholder"></div>
    <script>
        function loadComponent(url, elementId) { fetch(url).then(r => r.text()).then(d => document.getElementById(elementId).innerHTML = d); }
        window.addEventListener('load', function() { loadComponent('頁首.html', 'header-placeholder'); loadComponent('頁尾.html', 'footer-placeholder'); });
    </script>
</body>
</html>
